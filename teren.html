<script>
  // Auth-guard - isti kao na ostalim stranicama.
  (async function authGuard(){
    const SUPABASE_URL = 'https://stbknyvbduzrgnbmhpxl.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_TLFe8iXPlR95yOtExi7XVg_XrX22ERK';
    try {
      const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      window.__sbClient = sb;

      const { data: { session } } = await sb.auth.getSession();
      if (!session) {
        // Zapamti kamo je korisnik htio, da ga prijava vrati ovamo
        // umjesto na glavnu aplikaciju.
        try { sessionStorage.setItem('ng-povratak', 'teren.html'); } catch (e) {}
        Dnevnik.zapisi('prijava', 'pristup_odbijen_bez_sesije', { stranica: 'teren' });
        Dnevnik.isprazni(true);
        window.location.replace('login.html'); return;
      }
      const { data: aal } = await sb.auth.mfa.getAuthenticatorAssuranceLevel();
      if (!aal || aal.currentLevel !== 'aal2') {
        // Zapamti kamo je korisnik htio, da ga prijava vrati ovamo
        // umjesto na glavnu aplikaciju.
        try { sessionStorage.setItem('ng-povratak', 'teren.html'); } catch (e) {}
        Dnevnik.zapisi('prijava', 'pristup_odbijen_bez_mfa', { stranica: 'teren' });
        Dnevnik.isprazni(true);
        window.location.replace('login.html'); return;
      }
      const { data: { user } } = await sb.auth.getUser();
      Dnevnik.postaviKorisnika(user);
      window.__korisnik = user;

      const { data: dozvola } = await sb
        .from('dozvoljeni_korisnici').select('email').eq('email', user.email).maybeSingle();
      if (!dozvola) {
        Dnevnik.zapisi('prijava', 'pristup_odbijen_nije_odobren', { email: user && user.email });
        Dnevnik.isprazni(true);
        await sb.auth.signOut();
        window.location.replace('login.html'); return;
      }

      Dnevnik.zapisi('pregled', 'stranica_otvorena', { stranica: 'teren' });
      document.documentElement.style.visibility = 'visible';
    } catch (err) {
      Dnevnik.greska('auth_guard_teren', err);
      Dnevnik.isprazni(true);
      window.location.replace('login.html');
    }
  })();
</script>
<style>
  :root[data-theme="dark"]{
    --bg:#0A0C13; --panel:#14161F; --panel-alt:#191C27;
    --border:rgba(255,255,255,0.08); --border-strong:rgba(255,255,255,0.16);
    --text:#F3F2F7; --text-dim:#9296AB; --text-faint:#63667A;
    --magenta:#FE963B; --magenta-soft:rgba(254,150,59,0.16);
    --teal:#34D8A6; --teal-soft:rgba(52,216,166,0.16);

    --grey-soft:rgba(107,110,130,0.18);

    --grey-soft:rgba(110,113,128,0.12);

  :root[data-theme="light"]{ --text-dim:#555060; }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; }
  body{
    background:var(--bg); color:var(--text);
    font-family:'IBM Plex Sans',sans-serif;
    display:flex; flex-direction:column;

  h1,h2,h3{ font-family:'Space Grotesk',sans-serif; margin:0; }

  /* ---------- Zaglavlje ---------- */

  /* ---------- Birac vise vrijednosti ---------- */

<body>

<header>
  <img src="assets/alexigeo-mark.png" alt="" style="width:26px;height:26px;border-radius:7px;">
  <span class="naslov">Teren</span>
  <span class="gps" id="gps"><span class="gps-tocka"></span><span id="gpsTekst">tražim…</span></span>
  <button class="ikona-btn" id="btnTema" title="Tema">☀</button>
  <div class="izbornik-omot">
    <button class="ikona-btn" id="btnIzbornik" title="Korisnik">👤</button>
    <div class="izbornik" id="izbornik">
      <div class="iz-ime" id="izIme">–</div>
      <div class="iz-email" id="izEmail">–</div>
      <div class="iz-naslov">Verzija sučelja</div>
      <div class="iz-birac">
        <button id="btnVerzijaPuna">🖥 Računalo</button>
        <button id="btnVerzijaTeren" class="aktivna">📱 Mobitel</button>
      </div>
      <button class="iz-odjava" id="btnOdjava">Odjava</button>
    </div>
  </div>
</header>

<div class="trake">
  <!-- Uvijek vidljivo: nacin rada i gumb za filtere. Sve ostalo se uvlaci,
       jer je na telefonu od 390 px pet traka zauzimalo pola ekrana. -->

<script>
const $ = (s) => document.querySelector(s);
const sb = window.__sbClient;

let sveZgrade = [];          // laki indeks
let statusi = {};            // { id: {status, napomena} }
// Izlozeno asistentu (assets/chat.js) - on nema pristup Supabaseu, a treba
// znati sto je covjek vec presudio da bi mogao filtrirati po statusu.
window.__statusZaId = (id) => (statusi[id] || {}).status || 'nepotvrđeno';
let mojaPozicija = null;     // {lat, lon, tocnost}
let filterStatus = 'nepotvrđeno';
let radijus = 300;
let nacin = 'blizu';       // 'blizu' | 'popis' | 'karta'
// 'auto' zadrzava dosadasnje ponasanje: blizu mene po udaljenosti, ostalo po
// datumu. Ostali nacini vrijede bez obzira na odabrani prikaz.
let sortiranje = 'auto';
let kartaSvihObj = null;   // Leaflet instanca prikaza svih rezultata
// Vremenski prozor; 0 = sve.
//
// Na terenu je ZADANO "sve", a ne zadnji tjedan kao na ostalim stranicama.
// Razlog: tehnicar stoji na nekom mjestu i zanimaju ga sve neprovjerene
// zgrade oko sebe, bez obzira kad su zabiljezene. Uz tjedan dana i krug od
// 300 m popis je u pravilu prazan, sto izgleda kao kvar.
// Pri prelasku na "Cijeli popis" prozor se suzava na tjedan, jer bi inace
// popis imao 28 tisuca zgrada.
let tjedana = 0;
// Oznaka novosti na kartici. Filtar po njoj je maknut - zamijenile su ga tri
// kucice s glavne stranice - ali sam bedz ostaje, jer je koristan na terenu.
function novostZgrade(z){
  if (z.s === 'kandidat') return 'nova';
  if (z.s === 'stara') return 'nije';
  // "Nema snimke" i "jos nije provjereno" nisu ista stvar. Prvo znaci da
  // DGU ortofoto ne pokriva tu lokaciju - ovim putem nikad necemo saznati.
  // Drugo se rijesi sljedecim pokretanjem provjere.
  if (z.s === 'nema_snimke') return 'bezsnimke';
  return 'neprovjereno';
}

// Visestruki odabir - skupovi umjesto pojedinacne vrijednosti.
const odabrano = { z: new Set(), t: new Set(), k: new Set(), s: new Set() };

// Tri dokaza, isti kao na glavnoj stranici. Kombiniraju se I-logikom:
// svaki ukljuceni trazi da vrijedi i on.
// Tro-stanjni filtar po izvorima i odabrana kompozitna stanja - isti model
// kao na glavnoj stranici, dijeljen kroz assets/ocjena.js.
let filtarIzvora = { noviObris:null, ms:null, dof:null, dguNova:null, dguVise:null, osmOznake:null, osmObris:null };
// Zadano se otvara na potvrdjenim novogradnjama. To je posao koji se stvarno
// obilazi; ostalo su uglavnom naknadno ucrtane stare zgrade (u nasem mjerenju
// oko 93% svih zapisa), koje na terenu nemaju sto traziti.
let odabranaStanja = new Set(['potvrdjena-novogradnja']);

// Terenski indeks je zbijen (kratka imena polja), pa ga prevodimo u oblik koji
// Ocjena razumije. Radi se jednom po zapisu i pamti na samom zapisu.
function ocjenaZa(z){
  if (!z.__ocjena) {
    z.__ocjena = Ocjena.ocijeni(dokaziIzIndeksa(z));
    z.__ocjena.dokazi = dokaziIzIndeksa(z);
  }
  return z.__ocjena;
}

function dokaziIzIndeksa(z){
  const DA = Ocjena.DA, NE = Ocjena.NE, NEP = Ocjena.NEPOZNATO;
  return {
    // g = ima obris; retci iz DGU delte ga nemaju
    noviObris: z.g ? DA : NE,
    ms:        z.ms === 1 ? DA : z.ms === 0 ? NE : NEP,
    dof:       z.s === 'stara' ? DA : z.s === 'kandidat' ? NE : NEP,
    dguNova:   z.n === 1 ? DA : NE,
    dguVise:   z.v == null ? NEP : (z.v > 1 ? DA : NE),
    osmOznake: NEP,
    osmObris:  z.p === 1 ? DA : NE,
  };
}

// Koliko je filtera aktivno - ide na gumb, da se vidi i kad je panel uvucen.
function brojAktivnihFiltera(){
  let n = 0;
  if (tjedana !== 0) n++;
  if (filterStatus !== 'nepotvrđeno') n++;
  ['z','t','k','s'].forEach(p => { if (odabrano[p].size) n++; });
  n += odabranaStanja.size;
  n += Object.keys(filtarIzvora).filter(k => filtarIzvora[k]).length;
  return n;
}
const NAJVISE_PRIKAZANO = 200;
// Na karti crtamo puno vise od popisa - tocka je jeftina, kartica nije. Iznad
// ovoga i canvas na telefonu pocinje trzati.
const NAJVISE_NA_KARTI = 3000;
let otvorenaKartica = null;
let karticnaKarta = null;   // Leaflet instanca u otvorenoj kartici
let korisnikIme = null;

// ---------- Tema ----------
function postaviTemu(t){
  document.documentElement.setAttribute('data-theme', t);
  localStorage.setItem('ng-tema', t);
  $('#btnTema').textContent = t === 'dark' ? '☀' : '☾';
  document.querySelector('meta[name=theme-color]').setAttribute('content', t === 'dark' ? '#0A0C13' : '#F4F2F6');
}
postaviTemu(localStorage.getItem('ng-tema') || 'dark');
$('#btnTema').addEventListener('click', () => {
  postaviTemu(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
});

// ---------- Izbornik korisnika ----------
$('#btnIzbornik').addEventListener('click', (e) => {
  e.stopPropagation();
  $('#izbornik').classList.toggle('otvoren');
});
document.addEventListener('click', (e) => {
  if (!e.target.closest('.izbornik-omot')) $('#izbornik').classList.remove('otvoren');
});

// Prijelaz na punu aplikaciju. Izbor pamtimo, pa ga sljedeca prijava nece
// silom vratiti na terenski ekran samo zato sto je na mobitelu.
$('#btnVerzijaPuna').addEventListener('click', () => {
  try { localStorage.setItem('ng-nacin', 'puna'); } catch (e) {}
  Dnevnik.zapisi('pregled', 'promjena_verzije', { iz: 'teren', u: 'puna', s: 'teren' });
  Dnevnik.isprazni(true);
  window.location.href = 'index.html';
});

$('#btnVerzijaTeren').addEventListener('click', () => {
  // Vec smo ovdje - samo zapamti da je to zeljeni izbor.
  try { localStorage.setItem('ng-nacin', 'teren'); } catch (e) {}
  Dnevnik.zapisi('pregled', 'promjena_verzije', { iz: 'teren', u: 'teren', s: 'teren' });
  $('#izbornik').classList.remove('otvoren');
});

$('#btnOdjava').addEventListener('click', async () => {
  Dnevnik.zapisi('prijava', 'odjava', { stranica: 'teren' });
  Dnevnik.isprazni(true);
  await sb.auth.signOut();
  window.location.href = 'login.html';
});

function poruka(tekst, tip){
  const e = $('#poruka');
  e.textContent = tekst;
  e.className = 'traka-poruka ' + (tip || 'ok');
  clearTimeout(e._t);
  e._t = setTimeout(() => { e.className = 'traka-poruka'; }, 2600);
}

function escapeHtml(t){
  return String(t == null ? '' : t)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ---------- Udaljenost ----------
// Haversine. Na ovim udaljenostima bi i ravninska aproksimacija bila dovoljna,
// ali razlika u cijeni je zanemariva.
function udaljenost(lat1, lon1, lat2, lon2){
  const R = 6371000;
  const rad = Math.PI / 180;
  const dLat = (lat2 - lat1) * rad;
  const dLon = (lon2 - lon1) * rad;
  const a = Math.sin(dLat/2) ** 2 +
            Math.cos(lat1*rad) * Math.cos(lat2*rad) * Math.sin(dLon/2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

function formatirajDaljinu(m){
  if (m < 1000) return { broj: Math.round(m), jed: 'm' };
  return { broj: (m/1000).toFixed(1), jed: 'km' };
}

// ---------- Geolokacija ----------
function pratiLokaciju(){
  if (!navigator.geolocation){
    $('#gpsTekst').textContent = 'nema GPS-a';
    poruka('Preglednik ne podržava geolokaciju.', 'err');
    return;
  }
  navigator.geolocation.watchPosition(
    (poz) => {
      const prije = mojaPozicija;
      mojaPozicija = { lat: poz.coords.latitude, lon: poz.coords.longitude, tocnost: poz.coords.accuracy };
      const t = Math.round(poz.coords.accuracy);
      $('#gpsTekst').textContent = '±' + t + ' m';
      $('#gps').className = 'gps ' + (t <= 25 ? 'ok' : 'lose');
      // Ne precrtavamo na svaki mikropomak - samo ako se pomaknuo bar 5 m.
      if (!prije || udaljenost(prije.lat, prije.lon, mojaPozicija.lat, mojaPozicija.lon) > 5) prikazi();
    },
    (err) => {
      $('#gpsTekst').textContent = 'bez lokacije';
      $('#gps').className = 'gps lose';
      Dnevnik.zapisi('sustav', 'geolokacija_odbijena', { kod: err.code, poruka: err.message });
      prikazi();
    },
    { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 }
  );
}

// ---------- Podaci ----------
async function ucitajIndeks(){
  const res = await fetch('data/teren-indeks.json', { cache: 'no-cache' });
  if (!res.ok) throw new Error('Terenski indeks nije dostupan (HTTP ' + res.status + ')');
  const podaci = await res.json();
  sveZgrade = podaci.zgrade || [];
  // Tek sad se moze izracunati raspodjela po stanjima i izvorima.
  if (typeof crtajStanja === 'function') { crtajStanja(); crtajIzvore(); }
}

async function dohvatiStatuse(idjevi){
  if (idjevi.length === 0) return;
  const komadi = [];
  for (let i = 0; i < idjevi.length; i += 200) komadi.push(idjevi.slice(i, i + 200));
  const odgovori = await Promise.all(
    komadi.map(k => sb.from('zgrada_review').select('*').in('zgrada_id', k))
  );
  odgovori.forEach(({ data, error }) => {
    if (error) { Dnevnik.greska('teren_dohvat_statusa', error); return; }
    (data || []).forEach(r => {
      statusi[r.zgrada_id] = { status: r.status || 'nepotvrđeno', napomena: r.napomena || '' };
    });
  });
}

async function spremiStatus(id, status, napomena){
  const staro = statusi[id] || { status: 'nepotvrđeno', napomena: '' };
  const redak = {
    zgrada_id: id, status, napomena: napomena || null,
    azurirao: korisnikIme, azurirano_at: new Date().toISOString()
  };
  const { error } = await sb.from('zgrada_review').upsert(redak, { onConflict: 'zgrada_id' });
  if (error){
    Dnevnik.zapisi('evidencija', 'spremanje_neuspjelo', { tablica: 'zgrada_review', id, greska: error.message });
    throw error;
  }
  statusi[id] = { status, napomena: napomena || '' };
  Dnevnik.zapisi('evidencija', 'promjena_recenzije', {
    tablica: 'zgrada_review', id,
    status_staro: staro.status, status_novo: status,
    napomena_staro: staro.napomena || null, napomena_novo: napomena || null,
    promijenjen_status: staro.status !== status,
    promijenjena_napomena: (staro.napomena || '') !== (napomena || ''),
    izvor: 'teren'
  });
}

// ---------- Prikaz ----------
// Granica vremenskog prozora. Datum je u indeksu kao 'YYYY-MM-DD', pa se
// usporedba radi na nizovima - bez pretvaranja u Date za svaku zgradu.
function granicaProzora(){
  if (!tjedana) return null;
  const d = new Date(Date.now() - tjedana * 7 * 86400000);
  return d.toISOString().slice(0, 10);
}

function trenutniPopis(){
  const granica = granicaProzora();
  let popis = sveZgrade;

  if (granica) popis = popis.filter(z => !z.d || z.d >= granica);

  // Visestruki odabir: prazan skup znaci "sve", inace mora biti u skupu.
  if (odabrano.z.size) popis = popis.filter(z => odabrano.z.has(z.z));
  if (odabrano.t.size) popis = popis.filter(z => odabrano.t.has(z.t));
  if (odabrano.k.size) popis = popis.filter(z => odabrano.k.has(z.k));
  if (odabrano.s.size) popis = popis.filter(z => odabrano.s.has(z.s));

  // Kompozitno stanje (ILI) pa izvori (I).
  if (odabranaStanja.size) popis = popis.filter(z => odabranaStanja.has(ocjenaZa(z).stanje));
  popis = popis.filter(z => Ocjena.prolaziFiltar(ocjenaZa(z).dokazi, filtarIzvora));
  if (filterStatus) {
    popis = popis.filter(z => ((statusi[z.i] || {}).status || 'nepotvrđeno') === filterStatus);
  }

  // "Blizu mene" je ujedno i filtar po radijusu, ne samo poredak.
  if (nacin === 'blizu') {
    if (!mojaPozicija) return { stavke: [], ukupno: 0 };
    popis = popis.filter(z => udaljenost(mojaPozicija.lat, mojaPozicija.lon, z.y, z.x) <= radijus);
  }

  const s = popis.map(z => ({
    z, d: mojaPozicija ? udaljenost(mojaPozicija.lat, mojaPozicija.lon, z.y, z.x) : null
  }));

  poredaj(s);

  // U nacinu "karta" ne reze se na 200 - tocka na karti kosta puno manje od
  // kartice u popisu, a poanta prikaza je bas vidjeti raspored svih rezultata.
  const granicaPrikaza = nacin === 'karta' ? NAJVISE_NA_KARTI : NAJVISE_PRIKAZANO;
  return { stavke: s.slice(0, granicaPrikaza), ukupno: s.length };
}

// Poredak. 'auto' cuva dosadasnje ponasanje po nacinu prikaza, ostali su
// izricit izbor korisnika i vrijede u svakom nacinu.
function poredaj(s){
  const nacinSort = sortiranje === 'auto'
    ? (nacin === 'blizu' ? 'daljina' : 'datum')
    : sortiranje;

  if (nacinSort === 'daljina') {
    // Bez poznate pozicije nema po cemu sortirati - padamo na datum.
    if (!mojaPozicija) { s.sort((a, b) => (b.z.d || '').localeCompare(a.z.d || '')); return; }
    s.sort((a, b) => a.d - b.d);
  } else if (nacinSort === 'adresa') {
    s.sort((a, b) => (a.z.a || '\uffff').localeCompare(b.z.a || '\uffff', 'hr'));
  } else if (nacinSort === 'ocjena') {
    // Redoslijed iz Ocjena.STANJA - potvrdjene novogradnje na vrh.
    const rang = z => Ocjena.STANJA.findIndex(x => x.kljuc === ocjenaZa(z).stanje);
    s.sort((a, b) => rang(a.z) - rang(b.z) || (b.z.d || '').localeCompare(a.z.d || ''));
  } else {
    s.sort((a, b) => (b.z.d || '').localeCompare(a.z.d || ''));
  }
}

function prikazi(){
  const popis = $('#popis');

  // Radijus ima smisla samo u nacinu "blizu mene".
  $('#trakaRadijus').style.display = nacin === 'blizu' ? 'flex' : 'none';
  // Karta i popis se iskljucuju.
  // '' vraca na vrijednost iz CSS-a umjesto da nametne 'block' - tako pravilo
  // flex:1 1 auto ostane netaknuto.
  $('#kartaSvih').style.display = nacin === 'karta' ? '' : 'none';
  if (nacin !== 'karta') { const dt = $('#kartaDetalj'); if (dt) { dt.style.display = 'none'; dt.innerHTML = ''; } }
  popis.style.display = nacin === 'karta' ? 'none' : '';
  // Gumbi za odabir stoje u panelu filtera, pa se skrivaju s njim.

  if (nacin === 'blizu' && !mojaPozicija){
    $('#brojac').textContent = '';
    popis.innerHTML = '<div class="stanje"><b>Nema lokacije</b>' +
      'Uključi lokaciju i dopusti pristup u pregledniku. Bez nje ne mogu znati koje su zgrade blizu tebe.' +
      '<br><br>Do tada možeš koristiti <b>Cijeli popis</b>.</div>';
    return;
  }

  const { stavke, ukupno } = trenutniPopis();

  // Brojevi uz stanja i izvore crtaju crtajStanja() i crtajIzvore() - racunaju
  // se nad cijelim indeksom, ne nad trenutno filtriranim popisom.

  $('#brojac').textContent = ukupno === 0 ? '' :
    (ukupno > stavke.length
      ? 'Prikazano ' + stavke.length + ' od ' + ukupno.toLocaleString('hr-HR') + ' zgrada'
      : ukupno.toLocaleString('hr-HR') + (ukupno === 1 ? ' zgrada' : ' zgrada'));

  // Karta zamjenjuje popis - crtamo je i izlazimo prije gradnje kartica.
  if (nacin === 'karta') {
    if (karticnaKarta) { karticnaKarta.remove(); karticnaKarta = null; }
    nacrtajKartuSvih(stavke);
    return;
  }
  if (kartaSvihObj) { kartaSvihObj.remove(); kartaSvihObj = null; }

  if (stavke.length === 0){
    const razlog = nacin === 'blizu'
      ? 'U krugu od ' + (radijus < 1000 ? radijus + ' m' : (radijus/1000) + ' km') + ' nema zgrada koje odgovaraju filterima. Probaj povećati krug ili razdoblje.'
      : 'Nema zgrada koje odgovaraju filterima. Probaj šire razdoblje ili drugi status.';
    popis.innerHTML = '<div class="stanje"><b>Nema zgrada</b>' + razlog + '</div>';
    return;
  }

  popis.innerHTML = stavke.map(({ z, d }) => karticaHtml(z, d)).join('');

  // Popis se prerisuje pri svakoj promjeni, pa stara Leaflet instanca ostaje
  // vezana na uklonjen cvor. Uvijek je prvo unistimo.
  if (karticnaKarta) { karticnaKarta.remove(); karticnaKarta = null; }
  const otvorena = stavke.find(o => o.z.i === otvorenaKartica);
  if (otvorena) nacrtajKarticnuKartu(otvorena.z);
}

// Gradnja jedne kartice. Izdvojeno iz prikazi() jer se isti HTML koristi i u
// prikazu preko karte - ondje se otvara kao ploca nad kartom, umjesto da se
// korisnika vraca u popis gdje trazene kartice cesto ni nema (popis je rezan
// na 200 stavki).
function karticaHtml(z, d){
    const s = (statusi[z.i] || {}).status || 'nepotvrđeno';
    const nap = (statusi[z.i] || {}).napomena || '';
    const df = (d === null || d === undefined) ? null : formatirajDaljinu(d);
    const klasaBedza = s === 'potvrđeno' ? 'b-potvrdeno' : (s === 'odbačeno' ? 'b-odbaceno' : 'b-nepotvrdeno');
    return '<div class="kartica' + (otvorenaKartica === z.i ? ' otvorena' : '') + '" data-id="' + escapeHtml(z.i) + '">' +
      '<div class="k-vrh">' +
        '<div style="min-width:0;">' +
          '<div class="k-adresa">' + escapeHtml(z.a || 'Zgrada bez adrese') + '</div>' +
          '<div class="k-mjesto">' + escapeHtml(
            [z.m, nacin === 'popis' ? (z.z || '').replace(/\s*županija\s*$/i, '') : null, z.t]
              .filter(Boolean).join(' · ') || '—') + '</div>' +
          '<span class="bedz ' + klasaBedza + '">' + s + '</span>' +
          (function(){
            const n = novostZgrade(z);
            const o = {
              nova:         ['b-nova',   '● nova'],
              bezsnimke:    ['b-bezsn',  '◍ bez snimke'],
              neprovjereno: ['b-neprov', '◑ neprovj.'],
              nije:         ['b-nije',   '○ nije nova'],
            }[n];
            return ' <span class="bedz ' + o[0] + '">' + o[1] + '</span>';
          })() +
        '</div>' +
        '<div class="k-daljina">' +
          (df
            ? '<span class="num">' + df.broj + '</span><small>' + df.jed + '</small>'
            : '<small style="white-space:nowrap;">' + (z.d ? z.d.slice(8) + '.' + z.d.slice(5,7) + '.' : '') + '</small>') +
        '</div>' +
      '</div>' +
      '<div class="k-akcije">' +
        (otvorenaKartica === z.i ? '<div class="k-karta" id="kkarta"></div>' + dguPodaciBlok(z) : '') +
        '<div class="par">' +
          '<button class="veliki v-potvrdi" data-akcija="potvrđeno">✓ Potvrdi</button>' +
          '<button class="veliki v-odbaci" data-akcija="odbačeno">✕ Odbaci</button>' +
        '</div>' +
        '<textarea placeholder="Napomena (nije obavezno)">' + escapeHtml(nap) + '</textarea>' +
        '<div class="k-alat">' +
          '<a href="https://www.google.com/maps/dir/?api=1&destination=' + z.y + ',' + z.x + '" target="_blank" rel="noopener">🧭 Navigacija</a>' +
          '<a href="https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=' + z.y + ',' + z.x + '" target="_blank" rel="noopener">👁 Street View</a>' +
        '</div>' +
      '</div></div>';
}

// Ploca s punom karticom nad kartom. Ista kartica kao u popisu - ista dugmad,
// isto polje za napomenu, ista karta s tri sloja - samo prikazana preko karte
// umjesto u popisu.
function otvoriDetaljNadKartom(z, d){
  try { otvoriDetaljNadKartomUnutra(z, d); }
  catch (err) {
    // Tiho padanje bi izgledalo kao "dodir ne radi" - a upravo se to najteze
    // dijagnosticira na terenu, gdje nema konzole.
    Dnevnik.greska('teren_detalj', err);
    poruka('Kartica se nije otvorila: ' + err.message, 'err');
  }
}

function otvoriDetaljNadKartomUnutra(z, d){
  const el = $('#kartaDetalj');
  if (!el) return;
  otvorenaKartica = z.i;
  el.innerHTML = '<button class="detalj-zatvori" id="detaljZatvori">Zatvori ▾</button>'
    + karticaHtml(z, d);
  el.style.display = 'block';
  $('#detaljZatvori').addEventListener('click', zatvoriDetaljNadKartom);
  // Karta unutar kartice mora se crtati tek kad je element u dokumentu.
  if (karticnaKarta) { karticnaKarta.remove(); karticnaKarta = null; }
  nacrtajKarticnuKartu(z);
}

function zatvoriDetaljNadKartom(){
  const el = $('#kartaDetalj');
  if (!el) return;
  if (karticnaKarta) { karticnaKarta.remove(); karticnaKarta = null; }
  el.style.display = 'none';
  el.innerHTML = '';
  otvorenaKartica = null;
}

// ---------- Karta svih rezultata ----------
//
// Popis odgovara na "sto je na redu", karta na "gdje se to skuplja". Drugo se
// iz popisa ne vidi: dvadeset adresa u istoj ulici izgleda isto kao dvadeset
// razbacanih po zupaniji, a za planiranje obilaska je razlika presudna.
function nacrtajKartuSvih(stavke){
  const el = $('#kartaSvih');
  if (!el || typeof L === 'undefined') return;
  if (kartaSvihObj) { kartaSvihObj.remove(); kartaSvihObj = null; }
  if (!stavke.length) {
    el.innerHTML = '<div class="stanje"><b>Nema zgrada</b>Nijedna ne odgovara filtrima.</div>';
    return;
  }
  el.innerHTML = '';

  kartaSvihObj = L.map(el, { zoomControl: true, preferCanvas: true });
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '© OpenStreetMap'
  }).addTo(kartaSvihObj);

  // Canvas, ne SVG: kod nekoliko tisuca tocaka SVG na telefonu stane.
  const platno = L.canvas({ padding: 0.5 });
  const granice = [];

  stavke.forEach(({ z, d }) => {
    const st = Ocjena.stanjePoKljucu(ocjenaZa(z).stanje);
    const boja = st ? st.boja : '#6B7280';
    granice.push([z.y, z.x]);
    L.circleMarker([z.y, z.x], {
      renderer: platno, radius: 7, color: boja, weight: 2,
      fillColor: boja, fillOpacity: 0.6
    }).addTo(kartaSvihObj);
  });

  if (mojaPozicija) {
    L.circleMarker([mojaPozicija.lat, mojaPozicija.lon], {
      radius: 7, color: '#34D8A6', weight: 3, fillColor: '#34D8A6', fillOpacity: 0.9
    }).addTo(kartaSvihObj).bindTooltip('Vi ste ovdje');
    granice.push([mojaPozicija.lat, mojaPozicija.lon]);
  }

  // Otvaranje kartice NE visi o pogotku u sam kruzic. Kruzic je 6 px, a prst
  // pokriva 40-ak - trazenje tocnog pogotka na canvasu znacilo bi da vecina
  // dodira promasi. Umjesto toga hvatamo klik na kartu i uzimamo najblizu
  // tocku unutar 30 piksela.
  kartaSvihObj.on('click', (e) => {
    let najbliza = null, najmanje = Infinity;
    const t = e.containerPoint;
    stavke.forEach(({ z, d }) => {
      const p = kartaSvihObj.latLngToContainerPoint([z.y, z.x]);
      const r = Math.hypot(p.x - t.x, p.y - t.y);
      if (r < najmanje) { najmanje = r; najbliza = { z, d }; }
    });
    if (najbliza && najmanje <= 30) otvoriDetaljNadKartom(najbliza.z, najbliza.d);
  });

  // REDOSLIJED JE BITAN. Spremnik je tek postao vidljiv (display se mijenja u
  // prikazi()), pa Leaflet u trenutku stvaranja jos vidi nultu visinu. Ako
  // fitBounds pozovemo odmah, racuna okvir za krivu velicinu - karta ispadne
  // puna visine, ali se pocice crtaju samo u gornjem dijelu.
  //
  // Zato: prvo invalidateSize (Leaflet ocita stvarnu visinu), pa tek onda
  // fitBounds. requestAnimationFrame ceka da preglednik zavrsi raspored.
  const namjesti = () => {
    if (!kartaSvihObj) return;
    kartaSvihObj.invalidateSize();
    kartaSvihObj.fitBounds(L.latLngBounds(granice), { padding: [30, 30], maxZoom: 17 });
  };
  requestAnimationFrame(() => requestAnimationFrame(namjesti));
  // Jos jednom nakon kratke odgode - na sporijim telefonima raspored zna
  // kasniti i preko dva okvira.
  setTimeout(namjesti, 250);
}

// ---------- Karta u otvorenoj kartici ----------
//
// Ista tri sloja kao na glavnoj stranici. Na terenu su i vazniji: covjek stoji
// pred zgradom i usporedjuje sto vidi sa sluzbenom snimkom iz dvije epohe.
// Staticna slika koja je ovdje bila prije nije se mogla ni pomaknuti ni
// priblizti, pa je za provjeru susjedstva bila neupotrebljiva.
function nacrtajKarticnuKartu(z){
  const el = document.getElementById('kkarta');
  if (!el || typeof L === 'undefined') return;
  if (karticnaKarta) { karticnaKarta.remove(); karticnaKarta = null; }

  const dgu = L.tileLayer.wms('https://geoportal.dgu.hr/services/inspire/orthophoto_2023_2024/wms', {
    layers: 'OI.OrthoimageCoverage', format: 'image/png',
    version: '1.1.1', maxZoom: 21, attribution: 'DGU'
  });
  // DGU snima Hrvatsku u dva navrata: 2021. istok i jug, 2022. zapad i sjever.
  // Zato oba sloja u istoj grupi - pojedinacno je svaki prazan nad pola zemlje.
  const ranije = L.layerGroup([
    L.tileLayer.wms('https://geoportal.dgu.hr/services/inspire/orthophoto_2021/wms', {
      layers: 'OI.OrthoimageCoverage', format: 'image/png', version: '1.1.1', maxZoom: 21 }),
    L.tileLayer.wms('https://geoportal.dgu.hr/services/inspire/orthophoto_2022/wms', {
      layers: 'OI.OrthoimageCoverage', format: 'image/png', version: '1.1.1', maxZoom: 21 })
  ]);
  const osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '© OpenStreetMap' });
  const adrese = L.tileLayer.wms('https://geoportal.dgu.hr/services/inspire/ad/wms', {
    layers: 'AD.Address', format: 'image/png', transparent: true,
    version: '1.3.0', maxZoom: 21, attribution: 'DGU RPJ' });

  karticnaKarta = L.map(el, { layers: [dgu], zoomControl: true }).setView([z.y, z.x], 18);

  // Razvijen popis, isto kao na glavnoj stranici. Sklopljen izbornik je bio
  // samo ikona u kutu - covjek na terenu ne bi ni znao da slojevi postoje, a
  // upravo je prebacivanje izmedju epoha ono zbog cega karta ovdje stoji.
  L.control.layers(
    {
      'DGU ortofoto 2023./24.': dgu,
      'DGU ortofoto 2021./22.': ranije,
      'OSM (što je ucrtano)': osm
    },
    { 'DGU adresne točke (INSPIRE)': adrese },
    { collapsed: false }
  ).addTo(karticnaKarta);

  // Terenski indeks nosi samo tocku, ne obris - zato krug, ne poligon.
  L.circleMarker([z.y, z.x], {
    radius: 9, color: '#E0752D', weight: 3, fillOpacity: 0.25
  }).addTo(karticnaKarta);

  // Moja pozicija, ako je poznata - na terenu je korisno vidjeti odnos.
  if (mojaPozicija) {
    L.circleMarker([mojaPozicija.lat, mojaPozicija.lon], {
      radius: 6, color: '#34D8A6', weight: 2, fillColor: '#34D8A6', fillOpacity: 0.9
    }).addTo(karticnaKarta).bindTooltip('Vi ste ovdje');
  }

  // Dvostruka zastita: uz provjeru u rukovatelju kartice, i sam Leaflet
  // zaustavlja propagaciju dogadjaja koji ne idu istim putem (dvoklik, kotacic).
  L.DomEvent.disableClickPropagation(el);
  L.DomEvent.disableScrollPropagation(el);

  const namjestiKarticnu = () => { if (karticnaKarta) karticnaKarta.invalidateSize(); };
  requestAnimationFrame(() => requestAnimationFrame(namjestiKarticnu));
  setTimeout(namjestiKarticnu, 250);
}

// Sto DGU zna o ovoj lokaciji. Na terenu je broj adresnih tocaka na jednom
// objektu izravan pokazatelj broja jedinica, dakle i broja prikljucaka.
function dguPodaciBlok(z){
  const redci = [];
  if (z.a) redci.push(['Adresa', z.a]);
  if (z.m) redci.push(['Naselje', z.m]);
  if (z.v && z.v > 1) redci.push(['DGU adresa', z.v + ' — više jedinica']);
  if (z.o) redci.push(['Izvor', z.o]);
  if (z.ms !== null && z.ms !== undefined) {
    redci.push(['Microsoft', z.ms === 1 ? 'ima zgradu (do 2024.)' : 'nema zgradu (do 2024.)']);
  }
  if (!redci.length) return '';
  return '<div class="k-dgu"><div class="k-dgu-naslov">Podaci</div>' +
    redci.map(([a, b]) => '<div class="k-dgu-red"><span>' + a + '</span><span>' +
      escapeHtml(String(b)) + '</span></div>').join('') + '</div>';
}

// ---------- Interakcija ----------
// Isti rukovatelj vrijedi za popis i za plocu nad kartom - u oba slucaja je
// rijec o istoj kartici s istim gumbima.
['#popis', '#kartaDetalj'].forEach(sel => $(sel).addEventListener('click', rukujKlikNaKartici));

async function rukujKlikNaKartici(e){
  const kartica = e.target.closest('.kartica');
  if (!kartica) return;
  const id = kartica.dataset.id;

  const gumb = e.target.closest('[data-akcija]');
  if (gumb){
    const napomena = kartica.querySelector('textarea').value.trim();
    const status = gumb.dataset.akcija;
    kartica.querySelectorAll('.veliki').forEach(b => b.disabled = true);
    try {
      await spremiStatus(id, status, napomena);
      poruka(status === 'potvrđeno' ? 'Potvrđeno ✓' : 'Odbačeno ✕', 'ok');
      if (nacin === 'karta') { zatvoriDetaljNadKartom(); prikazi(); return; }
      otvorenaKartica = null;
      prikazi();
    } catch (err){
      poruka('Nije spremljeno: ' + err.message, 'err');
      kartica.querySelectorAll('.veliki').forEach(b => b.disabled = false);
    }
    return;
  }

  // Klik na tijelo kartice otvara/zatvara akcije. Ne zatvaramo ako je korisnik
  // kliknuo u polje za napomenu, poveznicu, ili BILO GDJE U KARTI - prebacivanje
  // sloja, pomicanje i zumiranje su klikovi unutar kartice i inace bi je zatvorili.
  if (e.target.closest('textarea') || e.target.closest('a') || e.target.closest('.k-karta')) return;
  // Nad kartom kartica je vec otvorena i klik na zaglavlje je zatvara.
  if (nacin === 'karta') { zatvoriDetaljNadKartom(); return; }

  otvorenaKartica = (otvorenaKartica === id) ? null : id;
  if (otvorenaKartica) Dnevnik.zapisi('pregled', 'pregled_zgrade', { zgrada_id: id, izvor: 'teren' });
  prikazi();
}

document.querySelectorAll('#trakaSort .cip').forEach(c => {
  c.addEventListener('click', () => {
    postaviCip('#trakaSort', c);
    sortiranje = c.dataset.sort;
    otvorenaKartica = null;
    Dnevnik.zapisiOdgodjeno('pregled', 'teren_sort', { nacin: sortiranje }, 1200);
    prikazi();
  });
});

// Prima ili traku ("#trakaStatus") ili puni selektor gumba
// ("#trakaNacin .cip[data-nacin]") - u drugom slucaju ne dodajemo ' .cip'.
function postaviCip(selektor, c){
  const puni = selektor.includes('.cip') ? selektor : selektor + ' .cip';
  document.querySelectorAll(puni).forEach(x => x.classList.remove('aktivan'));
  c.classList.add('aktivan');
}

// Selektor mora traziti [data-nacin], ne samo .cip.
//
// Gumb "Filteri" stoji u istoj traci i ima istu klasu, pa ga je siri selektor
// takodjer hvatao: klik na njega postavljao je nacin na undefined, popis je
// padao u granu "cijeli popis", a oznaka aktivnog nacina se premjestala na
// sam gumb Filteri.
document.querySelectorAll('#trakaNacin .cip[data-nacin]').forEach(c => {
  c.addEventListener('click', () => {
    postaviCip('#trakaNacin .cip[data-nacin]', c);
    nacin = c.dataset.nacin;
    otvorenaKartica = null;

    // Razuman prozor za svaki nacin: blizina trazi sirok, cijeli popis uzak.
    // Mijenjamo samo ako je korisnik na drugom kraju raspona - ako je sam
    // odabrao npr. 4 tjedna, to ne diramo.
    if (nacin === 'popis' && tjedana === 0) tjedana = 1;
    else if (nacin === 'blizu' && tjedana === 1) tjedana = 0;
    const cilj = document.querySelector('#trakaRazdoblje .cip[data-tjedana="' + tjedana + '"]');
    if (cilj) postaviCip('#trakaRazdoblje', cilj);

    Dnevnik.zapisi('pregled', 'teren_nacin', { nacin: nacin });
    prikazi();
  });
});

document.querySelectorAll('#trakaRazdoblje .cip').forEach(c => {
  c.addEventListener('click', () => {
    postaviCip('#trakaRazdoblje', c);
    tjedana = Number(c.dataset.tjedana);
    otvorenaKartica = null;
    osvjeziGumbe();
    Dnevnik.zapisiOdgodjeno('pregled', 'teren_razdoblje', { tjedana: tjedana }, 1200);
    prikazi();
  });
});

// ---------- Kompozitna stanja i tro-stanjni izvori ----------

// Brojevi se racunaju nad SVIM zapisima u indeksu, ne nad trenutno filtriranim
// popisom - inace bi klik na jedno stanje nulirao brojeve svih ostalih.
function crtajStanja(){
  const spremnik = $('#stanjaRed');
  if (!spremnik || !window.Ocjena) return;
  const svi = sveZgrade || [];
  const broj = {};
  svi.forEach(z => { const k = ocjenaZa(z).stanje; broj[k] = (broj[k] || 0) + 1; });

  spremnik.innerHTML = '';
  Ocjena.STANJA.forEach(st => {
    const n = broj[st.kljuc] || 0;
    const el = document.createElement('button');
    el.className = 'cip stanje-cip' + (odabranaStanja.has(st.kljuc) ? ' aktivan' : '');
    el.style.borderColor = odabranaStanja.has(st.kljuc) ? st.boja : '';
    el.innerHTML = '<span class="tocka" style="background:' + st.boja + '"></span>'
      + st.naziv + ' ' + n;
    el.addEventListener('click', () => {
      if (odabranaStanja.has(st.kljuc)) odabranaStanja.delete(st.kljuc);
      else odabranaStanja.add(st.kljuc);
      otvorenaKartica = null;
      crtajStanja(); crtajIzvore(); osvjeziGumbe(); prikazi();
    });
    spremnik.appendChild(el);
  });
}

function crtajIzvore(){
  const blok = $('#izvoriBlok');
  if (!blok || !window.Ocjena) return;
  const svi = sveZgrade || [];
  blok.innerHTML = '';

  Ocjena.IZVORI.forEach(izv => {
    let da = 0, ne = 0, nep = 0;
    svi.forEach(z => {
      const v = ocjenaZa(z).dokazi[izv.kljuc];
      if (v === Ocjena.DA) da++; else if (v === Ocjena.NE) ne++; else nep++;
    });

    const stanje = filtarIzvora[izv.kljuc];
    const red = document.createElement('label');
    red.className = 'izvor-red';
    if (stanje) red.setAttribute('data-stanje', stanje);
    red.innerHTML = '<span class="izvor-kvad">'
      + (stanje === 'da' ? '\u2713' : stanje === 'ne' ? '\u2715' : '')
      + '</span><span class="izvor-naziv">' + izv.naziv + '</span>'
      + '<span class="izvor-brojevi">' + da + ' / ' + ne
      + (nep ? ' (' + nep + ' ?)' : '') + '</span>';

    red.addEventListener('click', () => {
      const sad = filtarIzvora[izv.kljuc];
      filtarIzvora[izv.kljuc] = sad === null ? 'da' : sad === 'da' ? 'ne' : null;
      otvorenaKartica = null;
      crtajIzvore(); crtajStanja(); osvjeziGumbe(); prikazi();
    });
    blok.appendChild(red);
  });
}

// ---------- Birac vise vrijednosti ----------
// Padajuci izbornik s 53 tipa zgrade na telefonu je neupotrebljiv, pa se
// otvara plocha odozdo s trazilicom i kvacicama.
const NASLOVI = { z: 'Županije', t: 'Tip zgrade', k: 'Katovi', s: 'Ortofoto' };

// Statusi satelitske provjere pod imenima koja korisniku nesto znace.
const NAZIV_ORTOFOTA = {
  nema_snimke: 'nema ortofoto snimke',
  kandidat: 'nema je na snimci',
  stara: 'vidi se na snimci',
  neizvjesno: 'snimka nejasna',
  greska: 'greška pri provjeri',
};
let biracPolje = null;

function otvoriBirac(polje){
  biracPolje = polje;
  $('#biracNaslov').textContent = NASLOVI[polje];
  $('#biracTrazi').value = '';
  nacrtajBirac();
  $('#biracOmot').classList.add('otvoren');
}

function nacrtajBirac(){
  const trazi = $('#biracTrazi').value.trim().toLowerCase();
  const broj = {};
  sveZgrade.forEach(z => {
    const v = z[biracPolje];
    if (v === null || v === undefined || v === '') return;
    broj[v] = (broj[v] || 0) + 1;
  });
  const prikaz = (v) =>
    biracPolje === 'z' ? v.replace(/\s*županija\s*$/i, '')
    : biracPolje === 'k' ? v + (v === '1' ? ' kat' : ' kata')
    : biracPolje === 's' ? (NAZIV_ORTOFOTA[v] || v)
    : v;

  const stavke = Object.keys(broj)
    .filter(v => !trazi || prikaz(v).toLowerCase().includes(trazi))
    .sort((a, b) => broj[b] - broj[a]);

  $('#biracPopis').innerHTML = stavke.length
    ? stavke.map(v =>
        '<label><input type="checkbox" value="' + escapeHtml(v) + '"' +
        (odabrano[biracPolje].has(v) ? ' checked' : '') + '>' +
        escapeHtml(prikaz(v)) + '<span class="cnt">' + broj[v].toLocaleString('hr-HR') + '</span></label>'
      ).join('')
    : '<div class="stanje">Nema rezultata za „' + escapeHtml(trazi) + '”.</div>';
}

$('#biracPopis').addEventListener('change', (e) => {
  const cb = e.target.closest('input[type=checkbox]');
  if (!cb) return;
  if (cb.checked) odabrano[biracPolje].add(cb.value);
  else odabrano[biracPolje].delete(cb.value);
});

$('#biracTrazi').addEventListener('input', nacrtajBirac);

function zatvoriBirac(){
  $('#biracOmot').classList.remove('otvoren');
  otvorenaKartica = null;
  osvjeziGumbe();
  Dnevnik.zapisiOdgodjeno('pregled', 'teren_filter',
    { polje: biracPolje, odabrano: odabrano[biracPolje].size }, 1200);
  prikazi();
}

$('#biracGotovo').addEventListener('click', zatvoriBirac);
$('#biracZatvori').addEventListener('click', zatvoriBirac);
$('#biracOmot').addEventListener('click', (e) => { if (e.target === $('#biracOmot')) zatvoriBirac(); });
$('#biracOcisti').addEventListener('click', () => { odabrano[biracPolje].clear(); nacrtajBirac(); });

[['#btnZupanije','z'], ['#btnTipovi','t'], ['#btnKatovi','k'], ['#btnOrtofoto','s']].forEach(([sel, polje]) => {
  $(sel).addEventListener('click', () => otvoriBirac(polje));
});

// ---------- Ponistavanje ----------
$('#btnOcisti').addEventListener('click', () => {
  ['z','t','k','s'].forEach(p => odabrano[p].clear());
  filtarIzvora = { noviObris:null, ms:null, dof:null, dguNova:null, dguVise:null, osmOznake:null, osmObris:null };
  // Vraca na ZADANO, ne na prazno - inace bi "ponisti sve" dalo popis od
  // 28.000 zapisa, sto na terenu nije upotrebljivo.
  odabranaStanja = new Set(['potvrdjena-novogradnja']);
  crtajStanja(); crtajIzvore();
  tjedana = 0;
  filterStatus = 'nepotvrđeno';
  postaviCip('#trakaRazdoblje', document.querySelector('#trakaRazdoblje .cip[data-tjedana="0"]'));
  postaviCip('#trakaStatus', document.querySelector('#trakaStatus .cip[data-status="nepotvrđeno"]'));
  otvorenaKartica = null;
  Dnevnik.zapisi('pregled', 'teren_ocisti_filtere', {});
  osvjeziGumbe();
  prikazi();
});

// Gumbi moraju pokazivati stanje i kad je panel uvucen.
function osvjeziGumbe(){
  [['#btnZupanije','z'], ['#btnTipovi','t'], ['#btnKatovi','k'], ['#btnOrtofoto','s']].forEach(([sel, polje]) => {
    const n = odabrano[polje].size;
    const e = $(sel);
    e.textContent = NASLOVI[polje] + (n ? ' (' + n + ')' : '');
    e.classList.toggle('ima-odabir', n > 0);
  });
  const n = brojAktivnihFiltera();
  $('#brojFiltera').textContent = n ? '(' + n + ')' : '';
  $('#btnFiltri').classList.toggle('ima-filtera', n > 0);
}

document.querySelectorAll('#trakaStatus .cip').forEach(c => {
  c.addEventListener('click', () => {
    document.querySelectorAll('#trakaStatus .cip').forEach(x => x.classList.remove('aktivan'));
    c.classList.add('aktivan');
    filterStatus = c.dataset.status;
    Dnevnik.zapisiOdgodjeno('pregled', 'teren_filter_status', { status: filterStatus || 'sve' }, 1200);
    prikazi();
  });
});

document.querySelectorAll('#trakaRadijus .cip').forEach(c => {
  c.addEventListener('click', () => {
    document.querySelectorAll('#trakaRadijus .cip').forEach(x => x.classList.remove('aktivan'));
    c.classList.add('aktivan');
    radijus = Number(c.dataset.radijus);
    Dnevnik.zapisiOdgodjeno('pregled', 'teren_radijus', { metara: radijus }, 1200);
    prikazi();
  });
});

// ---------- Start ----------
(async function start(){
  try {
    for (let i = 0; i < 60 && !window.__korisnik; i++) await new Promise(r => setTimeout(r, 50));
    const meta = (window.__korisnik && window.__korisnik.user_metadata) || {};
    korisnikIme = meta.puno_ime || meta.full_name || meta.name ||
                  (window.__korisnik && window.__korisnik.email) || null;
    $('#izIme').textContent = korisnikIme || '–';
    $('#izEmail').textContent = (window.__korisnik && window.__korisnik.email) || '–';

    pratiLokaciju();
    await ucitajIndeks();

    // Popis zupanija gradimo iz podataka, ne tvrdo upisan - ako se pojavi
    // nova ili se promijeni naziv, sam se azurira.
    // Izbornici se vise ne pune unaprijed - birac ih gradi pri otvaranju,
    // iz trenutnih podataka.
    osvjeziGumbe();

    // Statuse dohvaćamo samo za zgrade u najširem krugu, ne za svih 28 tisuća.
    // Čekamo prvu poziciju - bez nje ne znamo koje su to.
    const cekajPoziciju = new Promise(r => {
      const t = setInterval(() => { if (mojaPozicija){ clearInterval(t); r(); } }, 200);
      setTimeout(() => { clearInterval(t); r(); }, 12000);
    });
    await cekajPoziciju;

    if (mojaPozicija){
      const blizu = sveZgrade
        .filter(z => udaljenost(mojaPozicija.lat, mojaPozicija.lon, z.y, z.x) <= 5000)
        .map(z => z.i);
      await dohvatiStatuse(blizu);
      Dnevnik.zapisi('sustav', 'teren_spreman', {
        zgrada_ukupno: sveZgrade.length, u_krugu_5km: blizu.length,
        tocnost_m: Math.round(mojaPozicija.tocnost)
      });
    }
    prikazi();
  } catch (err){
    Dnevnik.greska('teren_start', err, { fatalno: true });
    $('#popis').innerHTML = '<div class="stanje"><b>Greška pri učitavanju</b>' + escapeHtml(err.message) + '</div>';
  }
})();
</script>
