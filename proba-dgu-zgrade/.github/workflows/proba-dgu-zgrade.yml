name: "Proba: DGU sluzbene zgrade"

# Provjerava nase zgrade protiv sluzbenog DGU skupa (INSPIRE tema Zgrade).
# Skripta nista ne mijenja u repozitoriju - rezultat se cita iz loga.
#
# Prvo pokreni s "struktura" ukljucenim: skripta tada samo pogleda GML i
# ispise koji je koordinatni sustav i kako su elementi nazvani, bez ikakve
# pretvorbe. Tek kad se to potvrdi, pokreni punu usporedbu.
on:
  workflow_dispatch:
    inputs:
      struktura:
        description: "Samo pogledaj GML (bez usporedbe)"
        required: false
        default: true
        type: boolean

jobs:
  proba:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Preuzmi repozitorij
        uses: actions/checkout@v4

      - name: Postavi Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instaliraj ovisnosti
        run: PUPPETEER_SKIP_DOWNLOAD=true npm install

      - name: Pokreni probu
        # Vise memorije: GML se cita tokom, ali prostorna mreza i popis nasih
        # zgrada drze se u memoriji.
        run: |
          node --max-old-space-size=6144 scripts/proba-dgu-zgrade.js \
            ${{ inputs.struktura && '--struktura' || '' }}
