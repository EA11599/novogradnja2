name: Backfill datumi (jednokratno)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Preuzmi repozitorij
        uses: actions/checkout@v4

      - name: Postavi Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instaliraj ovisnosti
        run: PUPPETEER_SKIP_DOWNLOAD=true npm install

      - name: Pokreni backfill datuma
        run: node scripts/backfill-datumi.js

      - name: Commitaj promjene
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/zgrade
          if git diff --cached --quiet; then
            echo "Nema promjena za commit."
          else
            git commit -m "Backfill: datumi za postojece zgrade"
            git push
          fi
