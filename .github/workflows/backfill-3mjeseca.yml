name: Backfill 3 mjeseca (jednokratno)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Preuzmi repozitorij
        uses: actions/checkout@v4

      - name: Postavi Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instaliraj ovisnosti
        run: PUPPETEER_SKIP_DOWNLOAD=true npm install

      - name: Pokreni backfill zadnja 3 mjeseca
        run: node scripts/backfill-3mjeseca.js

      - name: Commitaj promjene
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/zgrade
          if git diff --cached --quiet; then
            echo "Nema promjena za commit."
          else
            git commit -m "Backfill: podaci za zadnja 3 mjeseca"
            git push
          fi
