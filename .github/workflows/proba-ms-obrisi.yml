name: "Proba: Microsoft obrisi zgrada"

# Samo rucno pokretanje. Skripta nista ne mijenja u repozitoriju - rezultat se
# cita iz loga.
on:
  workflow_dispatch:
    inputs:
      grad:
        description: "Grad na kojem se radi proba"
        required: true
        default: "varazdin"
        type: choice
        options:
          - varazdin
          - karlovac
          - zadar
          - osijek
          - split
          - trešnjevka

jobs:
  proba:
    runs-on: ubuntu-latest
    steps:
      - name: Preuzmi repozitorij
        uses: actions/checkout@v4

      - name: Postavi Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Pokreni probu
        run: node scripts/proba-ms-obrisi.js "${{ inputs.grad }}"
