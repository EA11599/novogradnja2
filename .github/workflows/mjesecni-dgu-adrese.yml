name: Tjedni dohvat DGU adresa

on:
  schedule:
    # Tjedno, ponedjeljkom u 02:00 UTC - sat vremena nakon OSM dohvata, da
    # krizna provjera radi nad svjezim skupom s obje strane.
    # Prije je bilo mjesecno (prvog u mjesecu), pa su nove adrese cekale i do
    # 30 dana prije nego bi se povezale sa zgradama.
    - cron: "0 2 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch-dgu:
    runs-on: ubuntu-latest
    steps:
      - name: Preuzmi repozitorij
        uses: actions/checkout@v4

      - name: Postavi Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instaliraj ovisnosti
        run: PUPPETEER_SKIP_DOWNLOAD=true npm install

      - name: Pokreni dohvat i obradu DGU adresa
        run: node --max-old-space-size=6144 scripts/fetch-dgu-adrese.js

      - name: Prebaci rezultate u data/dgu-adrese
        run: |
          rm -rf data/dgu-adrese
          mkdir -p data/dgu-adrese
          mv .tmp-dgu-out/*.geojson data/dgu-adrese/

      - name: Detektiraj nove DGU adrese (usporedba s proslim tjednom)
        run: node scripts/dgu-nove-adrese.js

      - name: Unakrsna provjera s postojecim OSM zgradama
        run: node scripts/dgu-osm-krizna-provjera.js

      # Isti kljuc kao u tjednom pipelineu - dijele istu predmemoriju, pa
      # onaj koji se pokrene drugi obicno ne mora nista skidati.
      - name: Predmemorija Microsoftovih obrisa
        uses: actions/cache@v4
        with:
          path: data/ms-obrisi
          key: ms-obrisi-2026-08-13

      - name: Preuzmi Microsoftove obrise (preskace vec preuzeto)
        run: node scripts/skini-ms-hrvatska.js

      # Glavni detektor: nova DGU adresa + Microsoft nema zgradu na toj
      # lokaciji (snimke do 2024.) = sagradjeno nakon 2024.
      - name: Detektiraj novogradnju (DGU adresa x odsutnost u Microsoftu)
        run: node scripts/dgu-ms-detektor.js

      # Registar akumulira kandidate kroz vrijeme i ZAMRZAVA presudu u
      # trenutku detekcije - vidi komentar na vrhu scripts/registar.js.
      - name: Upisi u registar novogradnje
        run: node scripts/registar.js

      - name: Commitaj promjene
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/dgu-adrese data/dgu-baza-adresa data/dgu-nove-adrese data/zgrade
          git add data/novogradnja data/registar-novogradnje.json 2>/dev/null || true
          git add data/ms-obrisi/snimke 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nema promjena za commit."
          else
            git commit -m "Tjedno azuriranje DGU adresa i detekcija novogradnje"
            git push
          fi
