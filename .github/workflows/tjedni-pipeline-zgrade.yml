name: Tjedno azuriranje novih zgrada

on:
  schedule:
    # Svaki ponedjeljak u 01:00 UTC (03:00 po hrvatskom ljetnom vremenu).
    - cron: "0 1 * * 1"
  workflow_dispatch: {}   # omogućava ručno pokretanje preko Actions taba

permissions:
  contents: write

jobs:
  fetch-zgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Preuzmi repozitorij
        uses: actions/checkout@v4

      - name: Postavi Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instaliraj ovisnosti
        run: npm install

      - name: Pokreni dohvat novih zgrada
        run: node scripts/fetch-zgrade.js

      - name: Satelitska verifikacija (novih zgrada bez adrese)
        run: node scripts/satelit-verifikacija.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # Microsoftovi obrisi su ~200 MB u 46 pocica. Bez predmemorije bi se
      # skidali svaki tjedan iznova. Kljuc je vezan na oznaku izdanja iz
      # scripts/lib/ms-indeks.js - kad se ondje promijeni IZDANJE, promijeni
      # i kljuc ovdje, inace bi se koristile stare pocice.
      - name: Predmemorija Microsoftovih obrisa
        uses: actions/cache@v4
        with:
          path: data/ms-obrisi
          key: ms-obrisi-2026-08-13

      - name: Preuzmi Microsoftove obrise (preskace vec preuzeto)
        run: node scripts/skini-ms-hrvatska.js

      # Upisuje msProvjera u nove zapise. Bez ovoga sucelje za njih ne moze
      # izracunati kompozitnu ocjenu - dokaz 'ms' ostaje nepoznat.
      - name: Upisi Microsoftov nalaz u zapise zgrada
        run: node scripts/backfill-ms-oznaka.js

      - name: Unakrsna provjera s novim DGU adresama
        run: node scripts/dgu-osm-krizna-provjera.js

      # Laki indeks za terenski ekran. MORA ici poslije krizne provjere,
      # da pokupi i DGU adrese koje ona pripise zgradama.
      - name: Generiraj terenski indeks
        run: node scripts/generiraj-teren-indeks.js

      - name: Commitaj promjene (ako ih ima)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/zgrade 2>/dev/null || true
          # Snimke indeksne tablice su nasa jedina povijest izdanja -
          # Microsoft stare verzije ne cuva. Same pocice su u .gitignore.
          git add data/ms-obrisi/snimke 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nema promjena za commit."
          else
            git commit -m "Tjedno azuriranje: nove zgrade $(date -u +%Y-%m-%d)"
            git push
          fi
