name: "Proba: koliko nasih zgrada Microsoft vec ima"

# Samo rucno pokretanje. Skripta nista ne mijenja u repozitoriju - rezultat se
# cita iz loga. Skida oko 740 MB Microsoftovih pocica, pa traje 10-20 minuta.
on:
  workflow_dispatch: {}

jobs:
  obrnuti-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Preuzmi repozitorij
        uses: actions/checkout@v4

      - name: Postavi Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Pokreni obrnuti test
        # Vise memorije jer se svaka pocica raspakirava u memoriju odjednom.
        run: node --max-old-space-size=6144 scripts/proba-ms-obrnuto.js
