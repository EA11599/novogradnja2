name: Satelitska verifikacija (jednokratno)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  verifikacija:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Preuzmi repozitorij
        uses: actions/checkout@v4

      - name: Postavi Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instaliraj ovisnosti
        run: PUPPETEER_SKIP_DOWNLOAD=true npm install

      - name: Pokreni satelitsku verifikaciju
        run: node scripts/satelit-verifikacija.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commitaj rezultate
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/zgrade
          if git diff --cached --quiet; then
            echo "Nema promjena za commit."
          else
            git commit -m "Satelitska verifikacija - DGU 2022 + Claude API"
            git push
          fi
