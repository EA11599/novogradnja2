name: Backfill obris + geometrijski indeks

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Preuzmi repozitorij
        uses: actions/checkout@v4

      - name: Postavi Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instaliraj ovisnosti
        run: PUPPETEER_SKIP_DOWNLOAD=true npm install

      - name: Pokreni backfill obrisa
        run: node scripts/backfill-obris.js

      # Obris bez upisane povrsine ne koristi nicemu - zgrada i dalje nema
      # osnovicu za usporedbu. Zato indeks nadopunjujemo odmah, u istom poslu.
      - name: Nadopuni geometrijski indeks
        if: always()
        run: node scripts/backfill-geometrija-indeks.js

      - name: Commitaj promjene
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/zgrade
          if git diff --cached --quiet; then
            echo "Nema promjena za commit."
          else
            git commit -m "Backfill: obris zgrada"
            git push
          fi
