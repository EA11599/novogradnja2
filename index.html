<!-- ?v= je oznaka verzije. Preglednik podskripte zna drzati u predmemoriji
     i kad se HTML osvjezi, pa promjena logike ocjenjivanja ne bi bila vidljiva.
     Kod svake izmjene ocjena.js podigni broj. -->
<script src="assets/ocjena.js?v=3"></script>
<script>
  // ---- Auth-guard: provjeri prijavu I MFA (aal2) PRIJE prikaza aplikacije ----
  // <html> element je sakriven (style="visibility:hidden" na <html> tagu) dok
  // provjera ne zavrsi - sprjecava bljesak sadrzaja neprijavljenom korisniku.
  // Ako provjera ne prodje, preusmjeri na login.html.
  (async function authGuard(){
    const SUPABASE_URL = 'https://stbknyvbduzrgnbmhpxl.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_TLFe8iXPlR95yOtExi7XVg_XrX22ERK';
    try {
      // JEDINI Supabase klijent na cijeloj stranici - spremljen na window da ga
      // ostatak skripte (dolje) ponovno koristi umjesto stvaranja novog. Vise
      // odvojenih klijenata na istoj stranici zna izazvati "Multiple GoTrueClient
      // instances" upozorenje i, gore, povremeno zaglavljene pozive prema Supabaseu.
      const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      window.__sbClient = sb;
      const { data: { session } } = await sb.auth.getSession();
      if (!session) {
        // Zapamti kamo je korisnik htio, da ga prijava vrati ovamo
        // umjesto na glavnu aplikaciju.
        try { sessionStorage.setItem('ng-povratak', 'index.html'); } catch (e) {}
        Dnevnik.zapisi('prijava', 'pristup_odbijen_bez_sesije', { stranica: 'index' });
        Dnevnik.isprazni(true);
        window.location.replace('login.html'); return;
      }
      const { data: aal } = await sb.auth.mfa.getAuthenticatorAssuranceLevel();
      if (!aal || aal.currentLevel !== 'aal2') {
        // Zapamti kamo je korisnik htio, da ga prijava vrati ovamo
        // umjesto na glavnu aplikaciju.
        try { sessionStorage.setItem('ng-povratak', 'index.html'); } catch (e) {}
        Dnevnik.zapisi('prijava', 'pristup_odbijen_bez_mfa', { stranica: 'index' });
        Dnevnik.isprazni(true);
        window.location.replace('login.html'); return;
      }

      // Provjeri popis dozvoljenih korisnika SVAKI PUT (ne samo pri prijavi) -
      // ako je admin nekoga uklonio s popisa, gubi pristup odmah pri sljedecem
      // otvaranju stranice, ne tek kad mu istekne sesija.
      const { data: { user } } = await sb.auth.getUser();
      Dnevnik.postaviKorisnika(user);
      const { data: dozvola } = await sb
        .from('dozvoljeni_korisnici')
        .select('email')
        .eq('email', user.email)
        .maybeSingle();
      if (!dozvola) {
        Dnevnik.zapisi('prijava', 'pristup_odbijen_nije_odobren', { email: user && user.email });
        Dnevnik.isprazni(true);
        await sb.auth.signOut();
        window.location.replace('login.html');
        return;
      }

      // prijava, MFA i odobrenje u redu - otkrij stranicu
      Dnevnik.zapisi('pregled', 'stranica_otvorena', { stranica: 'index' });
      document.documentElement.style.visibility = 'visible';
    } catch (err) {
      Dnevnik.greska('auth_guard', err);
      Dnevnik.isprazni(true);
      console.error('Auth-guard greška:', err);
      window.location.replace('login.html');
    }
  })();
</script>

  ::-webkit-scrollbar{ width: 7px; height:7px; }

  /* Compact styled version of the real sortable table */

  .building-table thead{ position: sticky; top:0; background: var(--panel); z-index: 2; }
  .building-table th{
    text-align:left; font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--text-faint); font-weight: 600; padding: 8px 14px; border-bottom: 1px solid var(--border);
    cursor:pointer; white-space:nowrap;
  }
  .building-table th:hover{ color: var(--magenta); }
  .building-table td{ padding: 9px 14px; border-bottom: 1px solid var(--border); color: var(--text); }
  .building-table tr:last-child td{ border-bottom:none; }
  .building-table tr:hover td{ background: var(--panel-alt); cursor:pointer; }
  .badge-tip{ display:inline-block; font-size:9.5px; background: var(--panel-alt); color: var(--text-dim); padding: 1px 7px; border-radius: 999px; }

<script>
const $ = (sel) => document.querySelector(sel);

// ---------- Recenzije (status + napomena) - Supabase ----------
// Ponovno koristi JEDINI klijent koji je auth-guard vec stvorio (window.__sbClient),
// umjesto da se stvara novi - izbjegava "Multiple GoTrueClient instances" upozorenje
// i moguce zaglavljene pozive koje ono uzrokuje.
const sbReview = window.__sbClient;

let trenutniKorisnikEmail = null;
let trenutniKorisnikIme = null; // prikazno ime - puno ime ako postoji, inace email
async function ucitajKorisnikaZaRecenzije(){
  const { data: { user } } = await sbReview.auth.getUser();
  trenutniKorisnikEmail = user ? user.email : null;
  const meta = (user && user.user_metadata) || {};
  // fallback lanac: nase custom polje -> Google-ovo standardno polje -> email
  trenutniKorisnikIme = meta.puno_ime || meta.full_name || meta.name || trenutniKorisnikEmail;
}

// Vraca DGU kljuc (stabilan pseudo-ID) iz street+houseNumber+settlement.
function dguKljuc(props){
  return [props.street || '', props.houseNumber || '', props.settlement || ''].join('|').toLowerCase();
}

// Dohvaca recenzije za popis ID-jeva iz zadane tablice ('zgrada_review' ili
// 'dgu_review') i vraca mapu { id: {status, napomena} }.
async function dohvatiRecenzije(tablica, kolonaId, idjevi){
  if (idjevi.length === 0) return {};
  const mapa = {};
  // Supabase .in() ima ogranicenje velicine URL-a - radimo u komadima od 200,
  // ali SVI komadi idu PARALELNO (Promise.all), ne jedan po jedan - puno brze
  // za veci broj zgrada.
  const komadi = [];
  for (let i = 0; i < idjevi.length; i += 200) komadi.push(idjevi.slice(i, i + 200));
  const rezultati = await Promise.all(
    komadi.map(komad => sbReview.from(tablica).select('*').in(kolonaId, komad))
  );
  rezultati.forEach(({ data, error }) => {
    if (error) { console.warn('Dohvat recenzija (' + tablica + ') nije uspio:', error.message); return; }
    (data || []).forEach(r => { mapa[r[kolonaId]] = r; });
  });
  return mapa;
}

// Sprema (upsert) recenziju - status + napomena.
async function spremiRecenziju(tablica, kolonaId, id, status, napomena, staro){
  const redak = { [kolonaId]: id, status, napomena: napomena || null, azurirao: trenutniKorisnikIme, azurirano_at: new Date().toISOString() };
  const { error } = await sbReview.from(tablica).upsert(redak, { onConflict: kolonaId });
  if (error) {
    Dnevnik.zapisi('evidencija', 'spremanje_neuspjelo', { tablica, id, greska: error.message });
    throw error;
  }
  // Biljezimo STARU i NOVU vrijednost - bez stare se poslije ne moze
  // rekonstruirati sto je tocno promijenjeno.
  const st = staro || {};
  Dnevnik.zapisi('evidencija', 'promjena_recenzije', {
    tablica: tablica,
    id: id,
    status_staro: st.status || null,
    status_novo: status,
    napomena_staro: st.napomena || null,
    napomena_novo: napomena || null,
    promijenjen_status: (st.status || null) !== (status || null),
    promijenjena_napomena: (st.napomena || null) !== (napomena || null)
  });
}

function statusBedz(status){
  const s = status || 'nepotvrđeno';
  const stilovi = {
    'potvrđeno': ['var(--teal-soft)', 'var(--teal)'],
    'odbačeno': ['var(--danger-soft)', 'var(--danger)'],
    'nepotvrđeno': ['var(--panel-alt)', 'var(--text-faint)'],
  };
  const [bg, fg] = stilovi[s] || stilovi['nepotvrđeno'];
  return '<span class="pouzd-badge" style="background:' + bg + ';color:' + fg + ';">' + s + '</span>';
}

function tag(f, k){ return (f.tags && f.tags[k]) || null; }

// Najbliža cesta se računa u pipeline-u (GitHub Actions), NE ovdje —
// izravni pozivi prema Overpass-u iz preglednika s GitHub Pages domene
// blokirani su CORS politikom servera. Ovdje samo čitamo gotov podatak
// koji je pipeline već spremio (f.nearestStreet / f.nearestStreetDist).
function prikazAdrese(f){
  const prava = [tag(f,'addr:street'), tag(f,'addr:housenumber')].filter(Boolean).join(' ');
  if (prava) return prava;
  if (f.dguAdresa) return [f.dguAdresa.street, f.dguAdresa.houseNumber].filter(Boolean).join(' ');
  if (f.nearestStreet) return '~' + f.nearestStreetDist + 'm od ' + f.nearestStreet;
  // Krajnji fallback - stupac Adresa nikad ne smije biti prazan. Ako baš
  // ništa drugo ne postoji (npr. najbliža cesta nije izračunata za tu
  // županiju), prikaži barem koordinate.
  if (f.lat !== null && f.lon !== null) return f.lat.toFixed(5) + ', ' + f.lon.toFixed(5);
  return null;
}
// "Približna" = samo procjena (najbliža cesta). DGU adresa je point-in-polygon
// potvrđena (DGU točka je doslovno unutar obrisa zgrade), pa se NE tretira
// kao približna, iako nije izvorno iz OSM-a.
function jeAdresaPriblizna(f){
  const prava = [tag(f,'addr:street'), tag(f,'addr:housenumber')].filter(Boolean).join(' ');
  return !prava && !f.dguAdresa;
}
// Odgovara na jedno pitanje koje korisnika stvarno zanima: JE LI OVO NOVA
// ZGRADA? Tri odgovora, bez postotaka i bez "pouzdanosti" koja zvuci kao
// mjera koju nemamo.
//
// ODLUKU VODI SAMO SATELITSKA PROVJERA, i to namjerno.
//
// Ranija verzija zbrajala je pet signala u tri razine. Mjerenje na 11.700
// provjerenih zgrada pokazalo je da ostali signali gotovo nista ne
// razlikuju: od zgrada iz masovnog unosa 99,2% je starih, a od onih koje
// nisu iz masovnog unosa 96,9%. Oba broja su toliko visoka da zbrajanje
// signala samo stvara privid preciznosti.
//
// Masovni unos i DGU adresa i dalje se prikazuju - ali kao KONTEKST u
// obrazlozenju, ne kao glasovi koji mijenjaju presudu.
function izracunajPouzdanost(f){
  const s = (f.satelitProvjera || {}).status;
  const razlozi = [];
  let tier;

  if (s === 'kandidat') {
    tier = 'nova';
    razlozi.push('Na državnom ortofotu 2023./24. na ovom mjestu nema zgrade - nastala je poslije snimanja');
  } else if (s === 'stara') {
    tier = 'nije';
    razlozi.push('Zgrada se jasno vidi na državnom ortofotu 2023./24. - postojala je i prije, netko ju je tek sada ucrtao');
  } else {
    tier = 'neprovjereno';
    if (s === 'neizvjesno') razlozi.push('Snimka je nejasna ili zaklonjena, procjena nije bila moguća');
    else razlozi.push('Zgrada još nije uspoređena s ortofotom');
    // Kod neprovjerenih masovni unos govori nesto o PRIORITETU: zgrade izvan
    // masovnog unosa cetiri puta cesce ispadnu kandidati.
    if (!f.masovniUnos) razlozi.push('Nije iz masovnog unosa - vrijedi provjeriti ranije');
  }

  // Kontekst, ne presuda.
  if ((f.satelitProvjera || {}).obrazlozenje) razlozi.push('Sa snimke: ' + f.satelitProvjera.obrazlozenje);
  if (f.masovniUnos) razlozi.push('Dio masovnog unosa (' + f.masovniUnos.brojZgrada + ' zgrada odjednom) - obično digitalizacija, ne gradnja');
  if (f.dguAdresa) razlozi.push('DGU adresa postoji unutar obrisa');

  return { tier, razlozi };
}

// Boje idu iz teme, ne tvrdo upisane - inace su neprocitljive u tamnom nacinu.
const OZNAKE_NOVOSTI = {
  nova:          ['var(--teal-soft)',  'var(--teal)',        '\u25CF vjerojatno nova'],
  nije:          ['var(--grey-soft)',  'var(--grey-signal)', '\u25CB nije nova'],
  neprovjereno:  ['var(--amber-soft)', 'var(--amber)',       '\u25D1 neprovjereno'],
};

function pouzdanostBedz(f){
  const { tier, razlozi } = izracunajPouzdanost(f);
  const [bg, fg, tekst] = OZNAKE_NOVOSTI[tier] || OZNAKE_NOVOSTI.neprovjereno;
  const naslov = escapeHtml(razlozi.join(' \u2022 '));
  return ' <span title="' + naslov + '" style="font-size:10px;font-weight:700;background:' + bg + ';color:' + fg + ';padding:1px 7px;border-radius:999px;white-space:nowrap;">' + tekst + '</span>';
}

function jeAdresaIzDgu(f){
  const prava = [tag(f,'addr:street'), tag(f,'addr:housenumber')].filter(Boolean).join(' ');
  return !prava && !!f.dguAdresa;
}

// Broj DGU adresa unutar obrisa zgrade - neutralan brojčani signal, ne
// interpretiramo ga kao "kuća" ili "zgrada" (DGU adrese unutar jednog
// obrisa najvjerojatnije odgovaraju zasebnim ulazima/stubištima, ali to
// nije potvrđeno pa namjerno ostajemo neutralni). Vidi
// scripts/lib/dgu-spajanje.js za detalje i ograničenja.
function tipZgradeBedz(f){
  const n = f.dguBrojJedinica;
  if (!n) return '';
  const tekst = n === 1 ? '1 DGU adresa' : n + ' zasebnih DGU adresa';
  return ' <span style="font-size:10px;background:#EDE9FE;color:#5B21B6;padding:1px 6px;border-radius:999px;">' + tekst + '</span>';
}

// Satelitski bedž - vidi scripts/satelit-verifikacija.js za kako se
// satelitProvjera popunjava. "kandidat" = nema zgrade na DGU 2022 ortofotu
// (vjerojatno stvarno nova), "stara" = zgrada VEĆ vidljiva 2022. (samo
// naknadno mapirana u OSM, ne nova gradnja).
function escapeHtml(tekst){
  const div = document.createElement('div');
  div.textContent = tekst == null ? '' : String(tekst);
  return div.innerHTML;
}
// Jedini pokazatelj koji sada stoji uz zgradu - presuda satelitske provjere.
// Ranije je uz njega stajala i "pouzdanost", koja je samo prepricavala isto,
// pa je maknuta.
//
// Boje idu iz teme; prije su bile tvrdo upisane svijetle nijanse, necitljive
// u tamnom nacinu rada.
const SATELIT_OZNAKE = {
  kandidat:     ['var(--teal-soft)',   'var(--teal)',        'satelit: nema je na snimci'],
  stara:        ['var(--grey-soft)',   'var(--grey-signal)', 'satelit: postojala 2023./24.'],
  nema_snimke:  ['var(--magenta-soft)','var(--magenta)',     'DGU nema snimku'],
  neizvjesno:   ['var(--amber-soft)',  'var(--amber)',       'satelit: neizvjesno'],
  greska:       ['var(--danger-soft)', 'var(--danger)',      'satelit: greška'],
};

function satelitBedz(f){
  if (!f.satelitProvjera) return '';
  const s = f.satelitProvjera;
  const o = SATELIT_OZNAKE[s.status];
  if (!o) return '';
  const naslov = escapeHtml(s.obrazlozenje || '');
  return ' <span title="' + naslov + '" style="font-size:10px;background:' + o[0] +
    ';color:' + o[1] + ';padding:1px 6px;border-radius:999px;white-space:nowrap;">' + o[2] + '</span>';
}


let manifest = null;
let zupanijeGeo = null;
let cachedChunks = {};      // file -> parsed diff data
let allFeaturesInWindow = []; // trenutno spojene zgrade za odabrani prozor
let selectedZupanije = new Set(); // prazan set = sve prikazane
// Nekadasnji samostalni filtri "satelitski kandidat" i "vise DGU adresa" sada

let selectedBuildingTypes = new Set();

window.__statusZaId = (id) => {

};
// Tri dokaza. Svaki je neovisan izvor; kombiniraju se I-logikom.
// Tro-stanjni filtar po izvorima: null = ne filtriraj, 'da' = ima dokaz,
// 'ne' = izvor je provjerio i nema ga. Nepoznato nikad ne prolazi ni 'da' ni
// 'ne' - to je cijela poanta prelaska s kvacica na tri stanja.
let filtarIzvora = { ms:null, dof:null, dguNova:null, dguVise:null, osmOznake:null, osmObris:null };

// Odabrana kompozitna stanja. Prazan skup = prikazi sva.
// Zadano su potvrdjene novogradnje - to je ono zbog cega netko otvara popis.
// Ostalo je uglavnom naknadno ucrtano (u mjerenju oko 93% zapisa), pa bi
// prazan odabir znacio da korisnik svaki put prvo mora filtrirati sam.
let odabranaStanja = new Set(['potvrdjena-novogradnja']);

// Kontekst koji Ocjena treba, a ne stoji na samom zapisu. znaObrise se
// prebacuje na true tek kad panel prosirenja zavrsi ucitavanje - do tada je
// dokaz 'osmObris' posteno nepoznat, umjesto laznog 'ne'.
let ocjenaCtx = { znaOznake:true, znaObrise:false, zgradeSPromjenom:null };

function ocjenaZa(f){
  if (!f.__ocjena) f.__ocjena = Ocjena.ocijeniZapis(f, ocjenaCtx);
  return f.__ocjena;
}

// Odakle redak dolazi. Bez ovoga se u jednoj listi ne razlikuje OSM zgrada
// (poligon) od DGU adresne tocke - a to su podaci razlicite prirode.
function izvorBedz(f){
  const izvor = f.izvor || 'OSM';
  const boje = { 'OSM': 'var(--text-faint)', 'DGU': 'var(--teal)', 'MS': 'var(--magenta)' };
  return '<span class="badge-tip" style="color:' + (boje[izvor] || 'var(--text-faint)') + ';">'
    + izvor + '</span>';
}

// Oznaka stanja u retku tablice. Naslov nosi obrazlozenje, pa korisnik na
// hover dobije odgovor na "zasto ovdje pise ovo" bez otvaranja modala.
function oznakaStanja(f){
  const o = ocjenaZa(f);
  const st = Ocjena.stanjePoKljucu(o.stanje);
  if (!st) return '<span class="muted">—</span>';
  const naslov = (st.opis + '\n\n' + (o.razlozi || []).join('\n')).replace(/"/g, '&quot;');
  return '<span class="stanje-oznaka" title="' + naslov + '">'
    + '<span class="tocka" style="background:' + st.boja + '"></span>'
    + st.naziv + '</span>';
}

// Dvije osi: stanje (ILI medju odabranima) i izvori (I medju odabranima).
function prolaziOcjenu(f){
  const o = ocjenaZa(f);
  if (odabranaStanja.size && !odabranaStanja.has(o.stanje)) return false;
  return Ocjena.prolaziFiltar(o.dokazi, filtarIzvora);
}
// Poziva se kad se promijeni kontekst (npr. stigne panel prosirenja).

}
// Odabir po stanju ortofoto snimke - stoji uz ostale filtere u panelu,
// jer je rijec o svojstvu zgrade, ne o dokazu da je nova.
let selectedOrtofoto = new Set();
// Id-evi zgrada koje se pojavljuju u panelu promjena. Puni se pri
// ucitavanju tog panela, pa filtar radi tek kad panel zavrsi.
let zgradeSPromjenom = new Set();
// Skupovi ucitani u trenutnom prozoru. Cuvaju se globalno jer updateStats
// racuna tjedni prosjek iz njihova broja, a zove se i izvan selectWindow -
// npr. kad DGU adrese ili prosirenja naknadno dodaju retke.
let ucitaniSkupovi = [];
let facetPanelOpen = false;
let map, geoLayer, markerLayer;
// Pocinje se od zadnjeg tjedna, ne od cijele retencije. Tri mjeseca znaci
// ucitavanje desetaka tisuca zgrada - sporo, a korisnika u pravilu zanima
// sto je novo od zadnjeg pregleda. Siri prozor je jedan klik dalje.
// Zadano je najsiri prozor. Ranije je bio 1 tjedan, jer je datum datoteke bio
// jedina vremenska os i "novo" je bilo jedino sto se moglo pitati. Otkad
// kandidati imaju trajan zapis i kompozitno stanje, korisnika vise ne zanima
// "sto je novo" nego "sto jos nije obradjeno" - a uzak prozor mu taj zaostatak
// aktivno skriva. Razdoblje je sada suzenje, ne polaziste.
let currentWindowWeeks = null;

const WINDOW_OPTIONS = [
  { label: '1 tjedan', weeks: 1 },
  { label: '4 tjedna', weeks: 4 },
  { label: '3 mjeseca', weeks: 13 },
  { label: 'Sve', weeks: null }, // null = cijela dostupna retencija
];

async function init(){

    fetch('data/zgrade/manifest.json', { cache: 'no-store' }),

  manifest = await manifestRes.json();

// Nove DGU adrese vise ne idu u zaseban panel nego kao RETCI u glavnu listu.
// Razlog: to su kandidati kao i svi drugi, samo iz drugog izvora. Dvije liste
// jedna do druge znacile su da korisnik istu prosudbu radi na dva mjesta.
//
// Prednost se daje izlazu detektora (data/novogradnja/), jer on uz adresu nosi
// i Microsoftov nalaz, pa redak odmah dobiva punu kompozitnu ocjenu. Ako tog
// izlaza nema, pada se na sirovu deltu (data/dgu-nove-adrese/), gdje je
// Microsoft nepoznat - i to se posteno prikaze kao "?".
async function loadDguNoveAdrese(){
  const izDetektora = await ucitajIzDetektora();
  if (izDetektora.length) { dodajDguRetke(izDetektora); return; }

  try {
    const res = await fetch('data/dgu-nove-adrese/manifest.json', { cache: 'no-store' });
    if (!res.ok) return;
    const dguManifest = await res.json();
    if (!dguManifest.entries || dguManifest.entries.length === 0) return;

    const zadnji = dguManifest.entries[dguManifest.entries.length - 1];
    const dataRes = await fetch(zadnji.file, { cache: 'no-store' });
    if (!dataRes.ok) return;
    const podaci = await dataRes.json();

    $('#statDguNove').textContent = podaci.count.toLocaleString('hr-HR');
    const kartica = $('#statDguNoveCard');
    if (kartica) kartica.style.display = 'block';

    dodajDguRetke((podaci.features || []).map(f => {
      const [lon, lat] = f.geometry.coordinates;
      const pr = f.properties || {};
      return {
        lat, lon,
        adresa: [pr.street, pr.houseNumber].filter(Boolean).join(' '),
        naselje: pr.settlement, grad: pr.city, postanskiBroj: pr.postcode,
        datum: podaci.datum, ms: null,
      };
    }));
  } catch (err) {
    console.warn('DGU nove adrese nisu dostupne:', err.message);
  }
}

async function ucitajIzDetektora(){
  try {
    const res = await fetch('data/novogradnja/manifest.json', { cache: 'no-store' });
    if (!res.ok) return [];
    const man = await res.json();
    const svi = [];
    for (const e of (man.entries || [])) {
      const r = await fetch(e.file, { cache: 'no-store' });
      if (!r.ok) continue;
      const d = await r.json();
      [...(d.novogradnja || []), ...(d.legalizacija || [])].forEach(z => {
        svi.push({
          lat: z.lat, lon: z.lon, adresa: z.adresa,
          naselje: z.naselje, grad: z.grad, postanskiBroj: z.postanskiBroj,
          datum: d.datum, ms: z.ms || null,
        });
      });
    }
    if (svi.length) {
      $('#statDguNove').textContent = svi.length.toLocaleString('hr-HR');
      const k = $('#statDguNoveCard');
      if (k) k.style.display = 'block';
    }
    return svi;
  } catch (err) { return []; }
}

// Pretvara DGU zapise u retke glavne liste. Kljuc je izveden iz koordinate -
// isti princip kao idStabilan u registru, jer adresna tocka nema OSM ID.
function dodajDguRetke(zapisi){
  const noviRedci = zapisi.map(z => ({
    id: 'dgu/' + z.lat.toFixed(5) + '_' + z.lon.toFixed(5),
    izvor: 'DGU',
    lat: z.lat, lon: z.lon,
    obris: null,
    zupanija: null,
    validFrom: z.datum ? z.datum + 'T00:00:00Z' : null,
    tags: {},
    dguAdresa: {
      street: z.adresa, houseNumber: '', settlement: z.naselje,
      city: z.grad, postcode: z.postanskiBroj,
    },
    dguTocke: [{
      street: z.adresa, houseNumber: '', settlement: z.naselje,
      city: z.grad, postcode: z.postanskiBroj, lon: z.lon, lat: z.lat,
    }],
    dguNovaAdresaPoklapanje: { street: z.adresa, houseNumber: '', datum: z.datum },
    // Nalaz detektora, ako ga ima. Bez njega dokaz 'ms' ostaje nepoznat.
    msProvjera: z.ms ? { ima: !!z.ms.ima, izdanje: null } : undefined,
  }));

  ugradiDodatneRetke(noviRedci);
}

// Priblizan centar poligona - prosjek svih tocaka. Dovoljno precizno za
// Google Maps poveznicu, ne treba puna geometrijska tocnost centroida.
function priblizniCentar(obris){
  if (!Array.isArray(obris) || obris.length === 0) return null;
  const zbroj = obris.reduce((acc, t) => [acc[0] + t[0], acc[1] + t[1]], [0, 0]);
  return [zbroj[0] / obris.length, zbroj[1] / obris.length]; // [lon, lat]
}

// Promjene na postojecim zgradama (prosirenja, prenamjene, nove adrese nad
// istim obrisom) takodjer ulaze u glavnu listu umjesto u zaseban panel.
// Kompozitna ocjena ih prepoznaje kao "Promjena na postojecoj".
async function loadProsirenja(){
  try {
    const res = await fetch('data/prosirenja/manifest.json', { cache: 'no-store' });
    if (!res.ok) { oznaciObriseKaoPoznate(new Set()); return; }
    const man = await res.json();
    if (!man.entries || man.entries.length === 0) { oznaciObriseKaoPoznate(new Set()); return; }

    const trideset = new Date();
    trideset.setUTCDate(trideset.getUTCDate() - 30);
    const noviji = man.entries.filter(e => new Date(e.to) > trideset);
    if (noviji.length === 0) { oznaciObriseKaoPoznate(new Set()); return; }

    let sve = [];
    for (const e of noviji) {
      const r = await fetch(e.file, { cache: 'no-store' });
      if (!r.ok) continue;
      const d = await r.json();
      sve = sve.concat(d.features || []);
    }
    if (!sve.length) { oznaciObriseKaoPoznate(new Set()); return; }

    sve.sort((a, b) => (b.validFrom || '').localeCompare(a.validFrom || ''));

    const idevi = new Set(sve.map(f => f.id));
    oznaciObriseKaoPoznate(idevi);

    // Zgrade koje NISU u trenutnom prozoru dodajemo kao nove retke; one koje
    // jesu vec postoje i samo su dobile dokaz 'osmObris'.
    const postojeci = new Set((allFeaturesInWindow || []).map(f => f.id));
    const dodatni = sve.filter(f => !postojeci.has(f.id)).map(f => {
      const c = priblizniCentar(f.obris) || [f.lon, f.lat];
      // izPromjena razlikuje "postojeci obris koji se promijenio" od
      // "novo ucrtanog obrisa" - to je dokaz 'noviObris'.
      return { ...f, izvor: 'OSM', izPromjena: true, lat: c[1], lon: c[0] };
    });
    if (dodatni.length) ugradiDodatneRetke(dodatni);
  } catch (err) {
    console.warn('Prosirenja nisu dostupna:', err.message);
    oznaciObriseKaoPoznate(new Set());
  }
}

// Dokaz 'osmObris' prestaje biti nepoznat tek kad ovaj dohvat zavrsi - i kad
// zavrsi prazan. Prazan rezultat je nalaz "ne", ne odsutnost nalaza.
function oznaciObriseKaoPoznate(idevi){
  zgradeSPromjenom = idevi;
  ocjenaCtx.zgradeSPromjenom = idevi;
  ocjenaCtx.znaObrise = true;
  if (typeof ponistiOcjene === 'function') ponistiOcjene();
  if (typeof osvjeziBrojeveDokaza === 'function') osvjeziBrojeveDokaza();
  updateTable();
}


function renderWindowButtons(){
  const wrap = $('#windowSelect');
  wrap.innerHTML = '';
  WINDOW_OPTIONS.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'window-btn' + (opt.weeks === currentWindowWeeks ? ' active' : '');
    btn.textContent = opt.label;
    btn.addEventListener('click', () => {
      document.querySelectorAll('.window-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectWindow(opt.weeks);
    });
    wrap.appendChild(btn);
  });
}

function entriesForWindow(weeks){
  if (!manifest.entries.length) return [];
  if (weeks === null) return manifest.entries.slice();
  const cutoff = new Date(manifest.entries[manifest.entries.length - 1].to);
  cutoff.setUTCDate(cutoff.getUTCDate() - weeks * 7);
  return manifest.entries.filter(e => new Date(e.to) > cutoff);
}

async function selectWindow(weeks){
  currentWindowWeeks = weeks;
  Dnevnik.zapisi('pregled', 'promjena_prozora', { tjedana: weeks });
  const __pocetakUcitavanja = Date.now();
  const entries = entriesForWindow(weeks);

  const dataSets = ucitaniSkupovi = (await Promise.all(entries.map(async (e) => {
    if (!cachedChunks[e.file]){
      try {
        const res = await fetch(e.file, { cache: 'no-store' });
        if (!res.ok) {
          console.warn('Datoteka nedostupna, preskačem:', e.file, res.status);
          return null;
        }
        cachedChunks[e.file] = await res.json();
      } catch (err) {
        console.warn('Greška pri dohvatu, preskačem:', e.file, err.message);
        return null;
      }
    }
    return cachedChunks[e.file];
  }))).filter(Boolean);

  allFeaturesInWindow = [];
  dataSets.forEach(d => allFeaturesInWindow.push(...d.features));
  selectedBuildingTypes.clear();
  selectedLevels.clear();

  const reviewMapa = await dohvatiRecenzije('zgrada_review', 'zgrada_id', allFeaturesInWindow.map(f => f.id));
  allFeaturesInWindow.forEach(f => {
    const r = reviewMapa[f.id];
    f.reviewStatus = r ? r.status : 'nepotvrđeno';
    f.reviewNapomena = r ? r.napomena : null;
    f.reviewAzurirao = r ? r.azurirao : null;
    f.reviewAzuriranoAt = r ? r.azurirano_at : null;
  });

  const imaSatelitskihPodataka = allFeaturesInWindow.some(f => f.satelitProvjera);



  updateStats(entries);
  updateZupanijeList();
  updateMap();
  updateTable();
  if (facetPanelOpen) renderFacetPanel();

  // Koliko je stvarno trajalo i koliko je zapisa doslo - kad netko javi
  // "sporo je" ili "nema podataka", ovdje pise brojka umjesto dojma.
  if (typeof osvjeziBrojeveDokaza === 'function') osvjeziBrojeveDokaza();
  if (typeof crtajAktivneFiltre === 'function') crtajAktivneFiltre();

  Dnevnik.zapisi('sustav', 'prozor_ucitan', {
    tjedana: weeks,
    trajanje_ms: Date.now() - __pocetakUcitavanja,
    broj_zgrada: allFeaturesInWindow.length,
    broj_datoteka: entries.length
  });
}

function updateStats(entries){
  const ukupno = allFeaturesInWindow.length.toLocaleString('hr-HR');
  $('#statTotal').textContent = ukupno;
  $('#statTotalBubble').textContent = ukupno;

  const tjedana = Math.max(entries.length, 1);
  const prosjek = Math.round(allFeaturesInWindow.length / tjedana).toLocaleString('hr-HR');
  $('#statAvgSub').textContent = prosjek + ' / tjedan prosjek';

  const counts = countByZupanija(allFeaturesInWindow);
  const aktivne = Object.keys(counts).filter(z => counts[z] > 0).length;
  $('#statZupanije').innerHTML = aktivne + '<span class="unit">/ 21</span> aktivnih';
  $('#statZupanijeSub').textContent = aktivne + '/21 županija';

  const zadnji = entries[entries.length - 1];
  $('#statUpdated').textContent = zadnji ? formatDatum(zadnji.to) : '–';
}

function countByZupanija(features){
  const counts = {};
  zupanijeGeo.features.forEach(f => counts[f.properties.naziv] = 0);
  features.forEach(f => {
    if (f.zupanija) counts[f.zupanija] = (counts[f.zupanija] || 0) + 1;
  });
  return counts;
}

let tileLayer = null;
function initMap(){
  map = L.map('map', { scrollWheelZoom: false }).setView([45.15, 16.8], 7);
  tileLayer = L.tileLayer(trenutnaTemaTileUrl(), {
    attribution: trenutnaTemaAtribucija(),
    maxZoom: 19,
  }).addTo(map);
  geoLayer = L.geoJSON(null).addTo(map);
  markerLayer = L.layerGroup().addTo(map);
}

// CARTO od nedavno trazi API kljuc, pa preko cijele karte ispisuje
// "API KEY REQUIRED". Dok kljuc ne dobijemo, padamo na OSM-ove pocice koje su
// bez kljuca i bez ogranicenja za nas obim. Kad kljuc stigne, upisi ga u
// CARTO_KLJUC i CARTO se automatski vraca u upotrebu.
const CARTO_KLJUC = '';

function trenutnaTemaTileUrl(){
  const tema = document.documentElement.getAttribute('data-theme');
  if (CARTO_KLJUC) {
    const stil = tema === 'dark' ? 'dark_all' : 'light_all';
    return 'https://{s}.basemaps.cartocdn.com/' + stil + '/{z}/{x}/{y}{r}.png?api_key=' + CARTO_KLJUC;
  }
  return 'https://tile.openstreetmap.org/{z}/{x}/{y}.png';
}

function trenutnaTemaAtribucija(){
  return CARTO_KLJUC ? '© OpenStreetMap, © CARTO' : '© OpenStreetMap';
}

function colorScale(count, max){
  if (count === 0 || max === 0) return '#EDEBE7';
  // log skala jer razlika izmedu tjedana zna biti velika (npr. bulk-import tjedan)
  const t = Math.log(count + 1) / Math.log(max + 1);
  // interpolacija izmedu blijedo-narancaste i tamno-narancaste
  const lo = [252, 235, 212]; // --accent-tint
  const hi = [182, 101, 12];  // --accent-dark
  const rgb = lo.map((c, i) => Math.round(c + (hi[i] - c) * t));
  return 'rgb(' + rgb.join(',') + ')';
}

function updateMap(){
  const counts = countByZupanija(allFeaturesInWindow);
  const max = Math.max(...Object.values(counts), 1);

  geoLayer.clearLayers();
  geoLayer.addData(zupanijeGeo);
  geoLayer.setStyle((f) => {
    const c = counts[f.properties.naziv] || 0;
    const isFiltered = selectedZupanije.size > 0 && !selectedZupanije.has(f.properties.naziv);
    return {
      fillColor: colorScale(c, max),
      fillOpacity: isFiltered ? 0.25 : 0.85,
      color: '#fff',
      weight: 1.5,
      opacity: 1,
    };
  });
  geoLayer.eachLayer((layer) => {
    const naziv = layer.feature.properties.naziv;
    const c = counts[naziv] || 0;
    layer.bindTooltip(naziv + ': ' + c + ' novih zgrada', { sticky: true });
    layer.on('click', () => toggleZupanija(naziv));
  });

  // legenda
  $('#legend').innerHTML =
    '<span class="legend-swatch" style="background:' + colorScale(0, max) + '"></span>0' +
    '<span class="legend-swatch" style="background:' + colorScale(max, max) + ';margin-left:8px;"></span>' + max;

  // markeri pojedinačnih zgrada (jednostavne točkice, ne obrisi - obrisi su
  // rezervirani za detaljnu kartu) - prikazujemo do razumne granice radi
  // performansi
  markerLayer.clearLayers();
  const filtered = getFilteredFeatures();
  const MAX_MARKERA = 1500;
  filtered.slice(0, MAX_MARKERA).forEach(f => {
    if (f.lat === null || f.lon === null) return;
    const m = L.circleMarker([f.lat, f.lon], {
      radius: 4,
      color: '#B6650C',
      weight: 1,
      fillColor: '#E8871E',
      fillOpacity: 0.85,
    });
    m.bindPopup(opisZgrade(f));
    markerLayer.addLayer(m);
  });
}

function opisZgrade(f){
  const adresa = prikazAdrese(f) || 'Adresa nepoznata';
  const adresaStil = jeAdresaPriblizna(f) ? ' style="font-style:italic;color:#6B6B6B;"' : '';
  const dguNapomena = jeAdresaIzDgu(f) ? ' <span style="font-size:10px;color:#6B6B6B;">(DGU)</span>' : '';
  const gmaps = 'https://www.google.com/maps/search/?api=1&query=' + f.lat + ',' + f.lon;
  const tagoviHtml = Object.entries(f.tags || {}).map(([k,v]) =>
    '<div>' + k + ' = ' + v + '</div>').join('');
  return '<div style="min-width:200px;">' +
    '<b' + adresaStil + '>' + adresa + '</b>' + dguNapomena + satelitBedz(f) + tipZgradeBedz(f) + '<br>' +
    (tag(f,'addr:city') || '') + (f.zupanija ? ' · ' + f.zupanija : '') +
    '<div style="color:#6B6B6B;font-size:12px;margin:4px 0;">' + (tag(f,'building') || 'zgrada') + ' · ' + formatDatum(f.validFrom) + '</div>' +
    '<a href="' + gmaps + '" target="_blank" rel="noopener" style="font-size:12.5px;">Otvori u Google Maps ↗</a>' +
    '<details style="margin-top:6px;"><summary style="cursor:pointer;font-size:12px;color:#6B6B6B;">Svi podaci</summary>' +
    '<div style="font-family:var(--font-mono);font-size:11.5px;margin-top:4px;color:#444;">' + tagoviHtml + '</div></details>' +
    '</div>';
}

function toggleZupanija(naziv){
  if (selectedZupanije.has(naziv)) selectedZupanije.delete(naziv);
  else selectedZupanije.add(naziv);
  Dnevnik.zapisiOdgodjeno('pregled', 'filter_zupanije',
    () => ({ odabrane: Array.from(selectedZupanije) }), 1500);
  updateZupanijeList();
  updateMap();
  updateTable();
  crtajAktivneFiltre();
  if (facetPanelOpen) renderFacetPanel();
}

function updateZupanijeList(){
  const counts = countByZupanija(allFeaturesInWindow);
  const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);

  $('#zupToggleBtn').classList.toggle('has-active', selectedZupanije.size > 0);

  const wrap = $('#zupList');
  wrap.innerHTML = '';
  sorted.forEach(([naziv, count]) => {
    const row = document.createElement('div');
    row.className = 'zup-row';
    const checked = selectedZupanije.size === 0 || selectedZupanije.has(naziv);
    row.innerHTML =
      '<input type="checkbox" ' + (checked ? 'checked' : '') + '>' +
      '<span class="zup-name">' + naziv + '</span>' +
      '<span class="zup-count' + (count === 0 ? ' zero' : '') + '">' + count + '</span>';
    row.addEventListener('click', (e) => {
      if (e.target.tagName !== 'INPUT') toggleZupanija(naziv);
    });
    row.querySelector('input').addEventListener('click', (e) => {
      e.stopPropagation();
      toggleZupanija(naziv);
    });
    wrap.appendChild(row);
  });
}

$('#clearZupBtn').addEventListener('click', () => {
  selectedZupanije.clear();
  updateZupanijeList();
  updateMap();
  updateTable();
});

function getFilteredFeatures(){
  const q = ($('#searchBox').value || '').toLowerCase().trim();
  return allFeaturesInWindow.filter(f => {
    if (selectedZupanije.size > 0 && !selectedZupanije.has(f.zupanija)) return false;
    if (selectedBuildingTypes.size > 0 && !selectedBuildingTypes.has(tag(f,'building') || '(bez oznake)')) return false;
    if (selectedLevels.size > 0 && !selectedLevels.has(tag(f,'building:levels') || '(nepoznato)')) return false;
    if (selectedStatuses.size > 0 && !selectedStatuses.has(f.reviewStatus || 'nepotvrđeno')) return false;
    if (!prolaziOcjenu(f)) return false;
    if (selectedOrtofoto.size > 0) {
      const st = (f.satelitProvjera || {}).status;
      const naziv = {
        nema_snimke: 'nema ortofoto snimke', kandidat: 'nema je na snimci',
        stara: 'vidi se na snimci', neizvjesno: 'snimka nejasna', greska: 'greška pri provjeri',
      }[st];
      if (!naziv || !selectedOrtofoto.has(naziv)) return false;
    }
    if (!q) return true;
    const hay = [tag(f,'addr:street'), tag(f,'addr:housenumber'), tag(f,'addr:city'), f.zupanija, tag(f,'name'), tag(f,'building')]
      .filter(Boolean).join(' ').toLowerCase();
    return hay.includes(q);
  });
}

function facetCounts(features, key, fallback){
  const counts = {};
  features.forEach(f => {
    const v = tag(f, key) || fallback;
    counts[v] = (counts[v] || 0) + 1;
  });
  return Object.entries(counts).sort((a,b) => b[1] - a[1]);
}

function renderFacetPanel(){
  // facet opcije se računaju na skupu nakon zupanija+pretraga filtera, ali PRIJE
  // vlastite facet selekcije, tako da brojke ostanu smislene dok biraš opcije
  const baseline = allFeaturesInWindow.filter(f => {
    if (selectedZupanije.size > 0 && !selectedZupanije.has(f.zupanija)) return false;
    const q = ($('#searchBox').value || '').toLowerCase().trim();
    if (!q) return true;
    const hay = [tag(f,'addr:street'), tag(f,'addr:housenumber'), tag(f,'addr:city'), f.zupanija, tag(f,'name'), tag(f,'building')]
      .filter(Boolean).join(' ').toLowerCase();
    return hay.includes(q);
  });

  const buildingCounts = facetCounts(baseline, 'building', '(bez oznake)').slice(0, 10);
  const levelCounts = facetCounts(baseline, 'building:levels', '(nepoznato)')
    .sort((a,b) => (parseInt(a[0]) || 99) - (parseInt(b[0]) || 99)).slice(0, 10);


  // Statusi satelitske provjere pod imenima koja korisniku nesto znace.
  const NAZIV_ORTOFOTA = {
    nema_snimke: 'nema ortofoto snimke',
    kandidat: 'nema je na snimci',
    stara: 'vidi se na snimci',
    neizvjesno: 'snimka nejasna',
    greska: 'greška pri provjeri',
  };
  const ortofotoBrojac = {};
  baseline.forEach(f => {
    const st = (f.satelitProvjera || {}).status;
    if (!st) return;
    ortofotoBrojac[st] = (ortofotoBrojac[st] || 0) + 1;
  });
  // Poredak: prvo ono zbog cega se ovaj filtar otvara.
  const ortofotoRedoslijed = ['nema_snimke', 'neizvjesno', 'kandidat', 'stara', 'greska'];
  const ortofotoCounts = ortofotoRedoslijed
    .filter(s => ortofotoBrojac[s] > 0)
    .map(s => [NAZIV_ORTOFOTA[s] || s, ortofotoBrojac[s]]);

  const pouzdanostBrojac = {};
  baseline.forEach(f => {
    const t = izracunajPouzdanost(f).tier;
    pouzdanostBrojac[t] = (pouzdanostBrojac[t] || 0) + 1;
  });
  const pouzdanostRedoslijed = ['nova', 'neprovjereno', 'nije'];
  const pouzdanostCounts = pouzdanostRedoslijed.filter(t => pouzdanostBrojac[t] > 0).map(t => [t, pouzdanostBrojac[t]]);

  const grupa = (naslov, entries, selectedSet) => {
    let html = '<div class="facet-group"><div class="facet-group-title">' + naslov + '</div>';
    entries.forEach(([val, count]) => {
      const checked = selectedSet.has(val);
      html += '<label class="facet-opt"><input type="checkbox" data-val="' + val.replace(/"/g,'&quot;') + '" ' + (checked ? 'checked' : '') + '>' +
        val + '<span class="fc">' + count + '</span></label>';
    });
    html += '</div>';
    return html;
  };

  const panel = $('#facetPanel');
  // Status vise nije ovdje - izvucen je u vidljivi red iznad tablice, jer se
  // rucna provjera radi stalno i ne treba biti sakrivena iza padajuceg panela.
  panel.innerHTML = grupa('Tip zgrade', buildingCounts, selectedBuildingTypes) + grupa('Katovi', levelCounts, selectedLevels) + grupa('Ortofoto', ortofotoCounts, selectedOrtofoto);

  const groups = panel.querySelectorAll('.facet-group');
  groups[0].querySelectorAll('input').forEach(cb => cb.addEventListener('change', (e) => {
    toggleSet(selectedBuildingTypes, e.target.dataset.val);
    updateTable();
    updateMap();
    crtajAktivneFiltre();
  }));
  groups[1].querySelectorAll('input').forEach(cb => cb.addEventListener('change', (e) => {
    toggleSet(selectedLevels, e.target.dataset.val);
    updateTable();
    updateMap();
    crtajAktivneFiltre();
  }));
  // Grupe se dohvacaju po redoslijedu u panelu.
  groups[2].querySelectorAll('input').forEach(cb => cb.addEventListener('change', (e) => {
    toggleSet(selectedOrtofoto, e.target.dataset.val);
    updateTable();
    updateMap();
    crtajAktivneFiltre();
  }));

  $('#facetToggleBtn').classList.toggle('has-active', selectedBuildingTypes.size > 0 || selectedLevels.size > 0 || selectedStatuses.size > 0 || selectedOrtofoto.size > 0);
}

function toggleSet(set, val){
  if (set.has(val)) set.delete(val); else set.add(val);
  Dnevnik.zapisiOdgodjeno('pregled', 'filter_promijenjen',

}

const PO_STRANICI = 500;
let trenutnaStranica = 1;
let sortStupac = null; // 'adresa' | 'mjesto' | 'zupanija' | 'tip' | 'datum'
let sortSmjer = 1; // 1 = uzlazno (A->Ž / najstarije), -1 = silazno (Ž->A / najnovije)

function vrijednostZaSort(f, stupac){
  switch(stupac){
    case 'adresa': return (prikazAdrese(f) || '').toLowerCase();
    case 'mjesto': return (tag(f,'addr:city') || (f.dguAdresa && f.dguAdresa.settlement) || '').toLowerCase();
    case 'zupanija': return (f.zupanija || '').toLowerCase();
    case 'izvor': return (f.izvor || 'OSM').toLowerCase();
    case 'tip': return (tag(f,'building') || '').toLowerCase();
    // Sortiramo po redoslijedu iz Ocjena.STANJA, ne abecedno - tako
    // potvrdjene novogradnje dolaze na vrh, a nedovoljno podataka na dno.
    case 'ocjena': return Ocjena.STANJA.findIndex(s => s.kljuc === ocjenaZa(f).stanje);
    case 'datum': return f.validFrom || '';
    case 'status': {
      const rang = { 'potvrđeno': 2, 'nepotvrđeno': 1, 'odbačeno': 0 };
      return rang[f.reviewStatus] ?? 1;
    }
    default: return '';
  }
}

function sortiraj(niz){
  if (!sortStupac) return niz;
  const kopija = niz.slice();
  kopija.sort((a, b) => {
    const va = vrijednostZaSort(a, sortStupac), vb = vrijednostZaSort(b, sortStupac);
    if (va < vb) return -1 * sortSmjer;
    if (va > vb) return 1 * sortSmjer;
    return 0;
  });
  return kopija;
}

function postaviSort(stupac){
  if (sortStupac === stupac) sortSmjer *= -1;
  else { sortStupac = stupac; sortSmjer = 1; }
  trenutnaStranica = 1;
  updateTable();
}

function strelica(stupac){
  if (sortStupac !== stupac) return '';
  return sortSmjer === 1 ? ' ↑' : ' ↓';
}

function updateTable(resetPage = true){
  if (resetPage) trenutnaStranica = 1;
  const filtered = sortiraj(getFilteredFeatures());
  const wrap = $('#tableWrap');

  if (filtered.length === 0){
    wrap.innerHTML = '<div class="empty-state"><div class="big">Nema rezultata</div>Pokušaj promijeniti razdoblje, županiju ili pretragu.</div>';
    $('#listFooter').textContent = '';
    return;
  }

  const ukupnoStranica = Math.max(1, Math.ceil(filtered.length / PO_STRANICI));
  if (trenutnaStranica > ukupnoStranica) trenutnaStranica = ukupnoStranica;
  const pocetak = (trenutnaStranica - 1) * PO_STRANICI;
  const prikazano = filtered.slice(pocetak, pocetak + PO_STRANICI);

  const th = (stupac, naslov) => '<th class="sortable-th" data-sort="' + stupac + '">' + naslov + strelica(stupac) + '</th>';

  let html = '<table class="building-table"><thead><tr>' +
    th('izvor','Izvor') + th('adresa','Adresa') + th('mjesto','Mjesto') + th('zupanija','Županija') + th('ocjena','Ocjena') + th('datum','Datum') + th('status','Status') +
    '</tr></thead><tbody>';

  prikazano.forEach((f, i) => {
    const adresa = prikazAdrese(f);
    const adresaHtml = adresa
      ? (jeAdresaPriblizna(f) ? '<span class="approx-addr">' + adresa + '</span>'
        : jeAdresaIzDgu(f) ? adresa + ' <span class="badge-tip" style="font-size:10px;">DGU</span>'
        : adresa)
      : '<span class="muted">—</span>';
    html += '<tr data-idx="' + i + '">' +
      '<td>' + izvorBedz(f) + '</td>' +
      '<td>' + adresaHtml + '</td>' +
      '<td>' + (tag(f,'addr:city') || (f.dguAdresa && f.dguAdresa.settlement) || '<span class="muted">—</span>') + '</td>' +
      '<td>' + (f.zupanija ? '<span class="badge-tip">' + f.zupanija + '</span>' : '<span class="muted">—</span>') + '</td>' +
      '<td>' + oznakaStanja(f) + '</td>' +
      '<td class="muted">' + formatDatum(f.validFrom) + '</td>' +
      '<td>' + statusBedz(f.reviewStatus) + '</td>' +
      '</tr>';
  });
  html += '</tbody></table>';
  wrap.innerHTML = html;

  wrap.querySelectorAll('th.sortable-th').forEach(el => {
    el.addEventListener('click', () => postaviSort(el.dataset.sort));
  });
  wrap.querySelectorAll('tbody tr').forEach(tr => {
    tr.addEventListener('click', () => openModal(prikazano[+tr.dataset.idx]));
  });

  const footerEl = $('#listFooter');
  footerEl.innerHTML = '';
  const info = document.createElement('span');
  info.textContent = filtered.length.toLocaleString('hr-HR') + ' zgrada' +
    (ukupnoStranica > 1 ? ' — stranica ' + trenutnaStranica + '/' + ukupnoStranica : '');
  footerEl.appendChild(info);

  if (ukupnoStranica > 1){
    const nav = document.createElement('div');
    nav.style.cssText = 'display:flex;gap:8px;align-items:center;';
    const prevBtn = document.createElement('button');
    prevBtn.textContent = '← Prethodna';
    prevBtn.className = 'btn-export';
    prevBtn.style.cssText = 'padding:5px 12px;font-size:12px;';
    prevBtn.disabled = trenutnaStranica === 1;
    prevBtn.addEventListener('click', () => { trenutnaStranica--; updateTable(false); });
    const nextBtn = document.createElement('button');
    nextBtn.textContent = 'Sljedeća →';
    nextBtn.className = 'btn-export';
    nextBtn.style.cssText = 'padding:5px 12px;font-size:12px;';
    nextBtn.disabled = trenutnaStranica === ukupnoStranica;
    nextBtn.addEventListener('click', () => { trenutnaStranica++; updateTable(false); });
    nav.appendChild(prevBtn);
    nav.appendChild(nextBtn);
    footerEl.appendChild(nav);
    footerEl.style.cssText = 'display:flex;justify-content:space-between;align-items:center;';
  } else {
    footerEl.style.cssText = '';
  }
}

// Poveznica na DGU snimku, uz onu na Google Maps.
//
// Na glavnoj stranici NE ugradujemo sliku nego samo link - prozor pregleda je
// ovdje kratak i sluzi brzom pregledu, a svaka ugradena snimka je jedan dohvat
// prema DGU posluzitelju. Na review.html i teren.html slika se prikazuje, jer
// se ondje zgrade stvarno procjenjuju.
// Obrazlozenje satelitske presude. Ranije je uz njega isla i poveznica na DGU
// snimku, ali otkad je ortofoto sloj na karti u modalu, poveznica je bila samo
// jos jedan klik do istog sadrzaja. Ostaje tekst - on objasnjava ZASTO je
// model presudio kako jest, sto se iz same snimke ne vidi.
// Sto DGU zna o ovoj zgradi. Do sada je adresa bila samo u naslovu modala, a
// ostalo skriveno u podacima - iako je kod telekom klijenta broj adresnih
// tocaka na jednom obrisu upravo ono sto znaci broj prikljucaka.
function dguPodaciBlok(f) {
  const tocke = f.dguTocke || [];
  const nova = f.dguNovaAdresaPoklapanje;
  if (!tocke.length && !f.dguAdresa && !nova) return '';

  const redak = (oznaka, vrijednost) =>
    '<div style="display:flex;gap:8px;font-size:11.5px;line-height:1.6;">' +
    '<span style="color:var(--text-faint);min-width:96px;">' + oznaka + '</span>' +
    '<span style="color:var(--text-secondary);">' + vrijednost + '</span></div>';

  let html = '<div style="margin-top:10px;padding:10px 12px;border:1px solid var(--border);' +
    'border-radius:8px;background:var(--bg-soft);">' +
    '<div style="font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;' +
    'color:var(--text-faint);margin-bottom:6px;">DGU registar prostornih jedinica</div>';

  if (tocke.length) {
    const popis = tocke.map(t =>
      escapeHtml([t.street, t.houseNumber].filter(Boolean).join(' ') || '—')).join(', ');
    html += redak('Adrese', popis);
    const prva = tocke[0];
    if (prva.settlement) html += redak('Naselje', escapeHtml(prva.settlement));
    if (prva.city && prva.city !== prva.settlement) html += redak('Grad', escapeHtml(prva.city));
    if (prva.postcode) html += redak('Poštanski broj', escapeHtml(prva.postcode));
    html += redak('Broj točaka', tocke.length +
      (tocke.length > 1 ? ' <span style="color:var(--magenta);">— više jedinica</span>' : ''));
  } else if (f.dguAdresa) {
    // Stariji zapisi, prije backfill-dgu-koordinate.js - nemaju koordinate.
    const a = f.dguAdresa;
    html += redak('Adresa', escapeHtml([a.street, a.houseNumber].filter(Boolean).join(' ')));
    if (a.settlement) html += redak('Naselje', escapeHtml(a.settlement));
    if (a.postcode) html += redak('Poštanski broj', escapeHtml(a.postcode));
    html += '<div style="font-size:10.5px;color:var(--text-faint);margin-top:6px;">' +
      'Koordinate nisu dostupne — pokreni backfill-dgu-koordinate.js za prikaz na karti.</div>';
  }

  if (nova) {
    html += redak('Nova adresa', escapeHtml([nova.street, nova.houseNumber].filter(Boolean).join(' ')) +
      (nova.datum ? ' <span style="color:var(--text-faint);">(' + escapeHtml(nova.datum) + ')</span>' : ''));
  }

  return html + '</div>';
}

function satelitObrazlozenje(f) {
  const s = f.satelitProvjera || {};
  if (!s.obrazlozenje) return '';
  return '<div style="font-size:11.5px;color:var(--text-secondary);margin-top:6px;line-height:1.45;">' +
    escapeHtml(s.obrazlozenje) + '</div>';
}


// ---------- Mini-karta u modalu ----------
//
// Zasto postoji: Googleove snimke Hrvatske dolaze od Airbusa i Maxara i znaju
// biti stare vise godina (u nasem uzorku i iz 2013.), pa se novogradnja na
// njima cesto uopce ne vidi. Recenzent zato mora moci prebaciti izvor umjesto
// da zakljucuje iz jedne snimke.
//
// Slojevi, redom po korisnosti za nas slucaj:
//   DGU 2023./24. - 25 cm, sluzbena drzavna snimka, isti dokaz na temelju
//                   kojeg je donesena satelitska presuda
//   DGU 2021.     - druga epoha; prebacivanje daje usporedbu prije/poslije
//   OSM           - vektorski; pokazuje TOCNO onaj poligon koji je mapper
//                   ucrtao, uz to i tko ga je ucrtao

let modalKarta = null;

// Stilovi za oba stanja karte postavljaju se IZRICITO, inline. Ranija verzija
// je pri smanjivanju samo brisala style atribut i oslanjala se na CSS klasu -
// to se pokazalo nepouzdanim (karta bi ostala prevelika i prekrila modal).
// Sada za svako svojstvo koje postavimo pri povecanju postoji parnjak koji ga
// vraca, pa nema oslanjanja na to sto ce pobijediti u kaskadi.
const STIL_MALA =
  'position:relative;top:auto;left:auto;right:auto;bottom:auto;' +
  'width:auto;height:260px;margin:12px 0 10px;z-index:auto;' +
  'border:1px solid var(--border);border-radius:8px;background:var(--bg-soft);';

const STIL_VELIKA =
  'position:fixed;top:0;left:0;right:0;bottom:0;' +
  'width:100vw;height:100vh;margin:0;z-index:99999;' +
  'border:none;border-radius:0;background:var(--bg-soft);';

function kartaJeMaks(){
  const el = document.getElementById('modalKarta');
  return !!(el && el.classList.contains('karta-maks'));
}

function osvjeziMaksGumb(){
  const el = document.getElementById('modalKarta');
  // Trazi po VLASTITOJ klasi. Ranije su i gumb za povecanje i gumb za
  // zatvaranje dijelili istu klasu, pa je querySelector znao uhvatiti krivi.
  const gumb = el && el.querySelector('.karta-gumb-maks');
  if (!gumb) return;
  const maks = kartaJeMaks();
  gumb.textContent = maks ? '\u2921' : '\u26F6';
  gumb.title = maks ? 'Vrati na manju kartu (Esc)' : 'Pove\u0107aj preko cijelog zaslona';
}

function vratiKartuUModal(){
  const el = document.getElementById('modalKarta');
  if (!el) return;
  el.classList.remove('karta-maks');
  el.style.cssText = STIL_MALA;
  if (modalKarta) setTimeout(() => modalKarta.invalidateSize(), 50);
  osvjeziMaksGumb();
}

function prebaciMaksKarte(){
  const el = document.getElementById('modalKarta');
  if (!el) return;
  if (kartaJeMaks()) { vratiKartuUModal(); return; }
  el.classList.add('karta-maks');
  el.style.cssText = STIL_VELIKA;
  if (modalKarta) setTimeout(() => modalKarta.invalidateSize(), 50);
  osvjeziMaksGumb();
}

function zatvoriModalIKartu(){
  vratiKartuUModal();
  uklomiModalKartu();
  $('#modalOverlay').classList.remove('open');
}

function uklomiModalKartu(){
  const el = document.getElementById('modalKarta');
  if (el) { el.classList.remove('karta-maks'); el.style.cssText = STIL_MALA; }
  if (modalKarta) { modalKarta.remove(); modalKarta = null; }
}

function nacrtajModalKartu(f){
  const el = document.getElementById('modalKarta');
  if (!el || !f.lat || !f.lon) return;

  uklomiModalKartu();

  const osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '© OpenStreetMap'
  });

  // NAPOMENA O LICENCAMA - ne dodavati slojeve bez provjere:
  //
  //   Google    - pocice se smiju prikazivati samo kroz njihov Maps JavaScript
  //               API ili Map Tiles API, uz kljuc i naplatu. Popularni trik s
  //               mt1.google.com/vt krsi uvjete koristenja.
  //   Esri      - World Imagery radi bez kljuca, ali prema Esrijevim uvjetima
  //               trazi ArcGIS Online/Enterprise licencu i NIJE dostupan za
  //               komercijalnu upotrebu. Njihova definicija nekomercijalnog je
  //               uska: usluga bez naplate, bez prihoda za tebe i korisnike.
  //               Za povratak treba ArcGIS Location Platform kljuc.
  //   Bing      - trazi kljuc.
  //
  // DGU je jedini izvor na razini zgrade koji je za nas i besplatan i pravno
  // cist: otvorena dozvola, bez ogranicenja komercijalne upotrebe, uz to i
  // 25 cm, dakle bolje od vecine satelitskih podloga.

  const dgu = L.tileLayer.wms('https://geoportal.dgu.hr/services/inspire/orthophoto_2023_2024/wms', {
    layers: 'OI.OrthoimageCoverage', format: 'image/png', transparent: false,
    version: '1.1.1', maxZoom: 21, attribution: 'DGU — Otvorena dozvola'
  });
  // Prethodna epoha. VAZNO: DGU snima Hrvatsku u dva navrata - snimanje 2021.
  // pokriva istocnu i juznu polovicu, a 2022. zapadnu i sjevernu. Zato su oba
  // sloja u istoj grupi: pojedinacno bi svaki bio prazan nad pola zemlje
  // (upravo se to dogadjalo nad Sesvetama). Zajedno daju cijelu Hrvatsku.
  const dofRanije = L.layerGroup([
    L.tileLayer.wms('https://geoportal.dgu.hr/services/inspire/orthophoto_2021/wms', {
      layers: 'OI.OrthoimageCoverage', format: 'image/png', transparent: false,
      version: '1.1.1', maxZoom: 21, attribution: 'DGU — Otvorena dozvola'
    }),
    L.tileLayer.wms('https://geoportal.dgu.hr/services/inspire/orthophoto_2022/wms', {
      layers: 'OI.OrthoimageCoverage', format: 'image/png', transparent: false,
      version: '1.1.1', maxZoom: 21, attribution: 'DGU — Otvorena dozvola'
    })
  ]);

  modalKarta = L.map(el, { layers: [dgu], zoomControl: true, attributionControl: true })
    .setView([f.lat, f.lon], 18);

  // Poredani po vremenu, od najnovijeg prema najstarijem - prebacivanje
  // odozgo prema dolje je onda putovanje unatrag kroz vrijeme.
  //
  // Preklopni sloj: INSPIRE tema Adrese (AD) iz Registra prostornih jedinica.
  // Anonimna usluga, cijela Hrvatska, otvorena dozvola. Crta SVE sluzbene
  // adresne tocke, pa se odmah vidi ima li susjedstvo adrese kojih nasa zgrada
  // nema - i obrnuto.
  const dguAdreseWms = L.tileLayer.wms('https://geoportal.dgu.hr/services/inspire/ad/wms', {
    layers: 'AD.Address', format: 'image/png', transparent: true,
    version: '1.3.0', maxZoom: 21, opacity: 0.9,
    attribution: 'DGU — Registar prostornih jedinica'
  });

  L.control.layers({
    'DGU ortofoto 2023./24.': dgu,
    'DGU ortofoto 2021./22.': dofRanije,
    'OSM (što je ucrtano)': osm
  }, {
    'DGU adresne točke (INSPIRE)': dguAdreseWms
  }, { collapsed: false }).addTo(modalKarta);

  // Gumb za povecanje, gornji lijevi kut.
  const MaksKontrola = L.Control.extend({
    options: { position: 'topleft' },
    onAdd: function(){
      const okvir = L.DomUtil.create('div', 'leaflet-bar');
      const a = L.DomUtil.create('a', 'karta-gumb karta-gumb-maks', okvir);
      a.href = '#';
      a.textContent = '\u26F6';
      a.title = 'Povećaj preko cijelog zaslona';
      L.DomEvent.on(a, 'click', function(e){
        L.DomEvent.stop(e);
        prebaciMaksKarte();
      });
      return okvir;
    }
  });
  new MaksKontrola().addTo(modalKarta);

  // Zatvaranje, gornji desni kut. UVIJEK vidljiv: u punom zaslonu je "×"
  // modala nedostupan, a u malom prikazu karta zna prekriti gornji dio modala,
  // pa se na njega ne moze racunati.
  const ZatvoriKontrola = L.Control.extend({
    options: { position: 'topright' },
    onAdd: function(){
      const okvir = L.DomUtil.create('div', 'leaflet-bar');
      const a = L.DomUtil.create('a', 'karta-gumb karta-gumb-zatvori', okvir);
      a.href = '#';
      a.textContent = '\u2715';
      a.title = 'Zatvori (Esc)';
      L.DomEvent.on(a, 'click', function(e){
        L.DomEvent.stop(e);
        zatvoriModalIKartu();
      });
      return okvir;
    }
  });
  new ZatvoriKontrola().addTo(modalKarta);

  // Obris zgrade preko podloge - odmah se vidi poklapa li se ucrtano sa snimkom.
  if (f.obris && f.obris.length >= 3) {
    L.polygon(f.obris.map(t => [t[1], t[0]]), {
      color: '#E0752D', weight: 2, fillOpacity: 0.15
    }).addTo(modalKarta);
  } else {
    L.circleMarker([f.lat, f.lon], {
      radius: 7, color: '#E0752D', weight: 2, fillOpacity: 0.3
    }).addTo(modalKarta);
  }

  // Sluzbene DGU adresne tocke koje padaju unutar OVOG obrisa. Razlikuju se od
  // WMS preklopa iznad: ovo su tocno one koje smo pridruzili zgradi, pa nose i
  // atribute. Ako ih je vise od jedne, to je signal podjele objekta na vise
  // jedinica - vidi se i prostorno, po rasporedu tocaka.
  const tocke = f.dguTocke || (f.dguAdresa && f.dguAdresa.lon ? [f.dguAdresa] : []);
  tocke.forEach(t => {
    if (typeof t.lat !== 'number' || typeof t.lon !== 'number') return;
    const naziv = [t.street, t.houseNumber].filter(Boolean).join(' ') || 'DGU adresa';
    const mjesto = [t.settlement, t.postcode, t.city].filter(Boolean).join(' · ');
    L.circleMarker([t.lat, t.lon], {
      radius: 5, color: '#34D8A6', weight: 2,
      fillColor: '#34D8A6', fillOpacity: 0.85
    }).bindTooltip(naziv + (mjesto ? '<br><span style="opacity:.7">' + mjesto + '</span>' : ''),
      { direction: 'top' }).addTo(modalKarta);
  });

  // Leaflet krivo izracuna velicinu dok je spremnik tek postao vidljiv.
  setTimeout(() => { if (modalKarta) modalKarta.invalidateSize(); }, 60);
}


function openModal(f){
  const adresa = prikazAdrese(f) || 'Adresa nepoznata';
  const adresaStil = jeAdresaPriblizna(f) ? ' style="font-style:italic;"' : '';
  const dguNapomena = jeAdresaIzDgu(f) ? ' <span style="font-size:11px;color:var(--text-secondary);font-weight:400;">(DGU)</span>' : '';
  const gmaps = 'https://www.google.com/maps/search/?api=1&query=' + f.lat + ',' + f.lon;
  const tagoviHtml = Object.entries(f.tags || {}).map(([k,v]) => '<div>' + k + ' = ' + v + '</div>').join('') || '<div class="muted">Nema dodatnih oznaka</div>';
  const trenutniStatus = f.reviewStatus || 'nepotvrđeno';
  const opcije = ['nepotvrđeno', 'potvrđeno', 'odbačeno'].map(s =>
    '<option value="' + s + '"' + (s === trenutniStatus ? ' selected' : '') + '>' + s.charAt(0).toUpperCase() + s.slice(1) + '</option>'
  ).join('');
  $('#modalCard').innerHTML =
    '<button class="modal-close" id="modalCloseBtn">×</button>' +
    '<h3' + adresaStil + '>' + adresa + dguNapomena + satelitBedz(f) + tipZgradeBedz(f) + '</h3>' +
    '<div style="color:var(--text-secondary);font-size:13.5px;">' + (tag(f,'addr:city') || '') + (f.zupanija ? ' · ' + f.zupanija : '') + '</div>' +
    '<div style="color:var(--text-secondary);font-size:13px;margin-top:4px;">' + (tag(f,'building') || 'zgrada') + ' · ' + formatDatum(f.validFrom) + '</div>' +
    '<div id="modalKarta" class="modal-karta"></div>' +
    // OSM i DGU ortofoto su sada slojevi na karti iznad, pa im zasebne
    // poveznice vise ne trebaju. Google ostaje jer ga ne smijemo ugraditi.
    '<a class="modal-gmaps" href="' + gmaps + '" target="_blank" rel="noopener">Otvori u Google Maps ↗</a>' +
    satelitObrazlozenje(f) +
    dguPodaciBlok(f) +
    '<div class="review-section">' +
      '<label class="review-label">Status</label>' +
      '<select id="modalStatusSelect">' + opcije + '</select>' +
      '<label class="review-label">Napomena</label>' +
      '<textarea id="modalNapomenaInput" placeholder="Dodaj napomenu (vidljivo samo ovdje, ne na glavnoj tablici)...">' + escapeHtml(f.reviewNapomena) + '</textarea>' +
      '<button class="btn-export" id="modalSpremiBtn" style="width:100%;justify-content:center;margin-top:8px;">Spremi</button>' +
      '<div id="modalSpremljenoNote" style="display:none;font-size:11.5px;color:var(--teal);margin-top:8px;">✓ Spremljeno</div>' +
      azuriraoInfoHtml(f) +
    '</div>' +
    '<div class="modal-tags">' + tagoviHtml + '</div>';
  $('#modalOverlay').classList.add('open');
  nacrtajModalKartu(f);
  Dnevnik.zapisi('pregled', 'pregled_zgrade', { zgrada_id: f.id, zupanija: f.zupanija || null, status: f.reviewStatus || null });

  $('#modalSpremiBtn').addEventListener('click', async () => {
    const btn = $('#modalSpremiBtn');
    const noviStatus = $('#modalStatusSelect').value;
    const novaNapomena = $('#modalNapomenaInput').value.trim();
    btn.disabled = true;
    btn.textContent = 'Spremanje...';
    try {
      await spremiRecenziju('zgrada_review', 'zgrada_id', f.id, noviStatus, novaNapomena,
        { status: f.reviewStatus, napomena: f.reviewNapomena });
      f.reviewStatus = noviStatus;
      f.reviewNapomena = novaNapomena || null;
      f.reviewAzurirao = trenutniKorisnikIme;
      f.reviewAzuriranoAt = new Date().toISOString();
      $('#modalSpremljenoNote').style.display = 'block';
      const postojeciInfo = document.getElementById('modalAzuriraoInfo');
      const noviInfoHtml = azuriraoInfoHtml(f);
      if (postojeciInfo) postojeciInfo.outerHTML = noviInfoHtml;
      else $('#modalSpremljenoNote').insertAdjacentHTML('afterend', noviInfoHtml);
      updateTable(); // odmah osvjezi bedz u tablici
    } catch (err) {
      alert('Greška pri spremanju: ' + err.message);
    } finally {
      btn.disabled = false;
      btn.textContent = 'Spremi';
    }
  });
}

// Otvara isti modal, ali za DGU adresu (pojednostavljen sadrzaj - nema OSM
// oznaka/pouzdanosti/satelita, samo adresa + status + napomena).

$('#modalOverlay').addEventListener('click', (e) => {
  if (e.target.id === 'modalOverlay' || e.target.id === 'modalCloseBtn') {
    if (kartaJeMaks()) return; // karta prekriva ekran - klik ispod nije namjeran
    uklomiModalKartu();
    $('#modalOverlay').classList.remove('open');
  }
});
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  // Esc je dvostupanjski: prvo vraca kartu iz punog zaslona, a tek sljedeci
  // Esc zatvara modal. Inace bi korisnik iz pune karte ispao ravno van.
  if (kartaJeMaks()) { vratiKartuUModal(); return; }
  zatvoriModalIKartu();
});

$('#searchBox').addEventListener('input', () => {
  updateTable();
  if (facetPanelOpen) renderFacetPanel();
});

// Zetoni aktivnih odabira iz padajucih panela. Panel se zatvori i korisnik
// vise ne vidi sto je odabrao - dosad je jedini trag bio zamucen gumb, sto ne
// govori NI koji filtar NI koja vrijednost. Svaki zeton se moze pojedinacno
// skinuti, a kad ih ima vise od jednog nudi se i brisanje svih odjednom.
function crtajAktivneFiltre(){
  const spremnik = $('#aktivniFiltri');
  if (!spremnik) return;
  spremnik.innerHTML = '';

  // Redoslijed je namjerno isti kao u panelu, da se oko ne mora tražiti.
  const popis = [
    { oznaka: 'Tip',       skup: selectedBuildingTypes },
    { oznaka: 'Katovi',    skup: selectedLevels },
    { oznaka: 'Ortofoto',  skup: selectedOrtofoto },
    { oznaka: 'Status',    skup: selectedStatuses },
    { oznaka: 'Županija',  skup: selectedZupanije },
  ];

  let ukupno = 0;
  popis.forEach(({ oznaka, skup }) => {
    if (!skup || !skup.size) return;
    [...skup].forEach(vrijednost => {
      ukupno++;
      const el = document.createElement('span');
      el.className = 'filtar-zeton';
      el.innerHTML = '<span class="vrsta">' + oznaka + ':</span> ' + escapeHtml(String(vrijednost));
      const x = document.createElement('button');
      x.textContent = '×';
      x.title = 'Ukloni ovaj filtar';
      x.addEventListener('click', () => {
        skup.delete(vrijednost);
        if (oznaka === 'Županija') updateZupanijeList();
        osvjeziSveFiltre();
      });
      el.appendChild(x);
      spremnik.appendChild(el);
    });
  });

  if (ukupno > 1) {
    const ocisti = document.createElement('button');
    ocisti.className = 'filtar-ocisti';
    ocisti.textContent = 'Očisti sve';
    ocisti.addEventListener('click', () => {
      [selectedBuildingTypes, selectedLevels, selectedOrtofoto, selectedStatuses, selectedZupanije]
        .forEach(s => s.clear());
      updateZupanijeList();
      osvjeziSveFiltre();
    });
    spremnik.appendChild(ocisti);
  }
}

// Jedno mjesto za osvjezavanje svega nakon promjene filtra.
function osvjeziSveFiltre(){
  if (facetPanelOpen) renderFacetPanel();
  crtajAktivneFiltre();
  updateTable();
  updateMap();
  osvjeziBrojeveDokaza();
}

// Ugradjuje retke iz drugih izvora (DGU adrese, promjene na postojecim) u
// glavnu listu. Duplikati se odbacuju po ID-u - isti objekt moze doci iz vise
// dohvata, a lista mora ostati jedan redak po objektu.
function ugradiDodatneRetke(redci){
  if (!Array.isArray(allFeaturesInWindow)) allFeaturesInWindow = [];
  const postojeci = new Set(allFeaturesInWindow.map(f => f.id));
  const novi = redci.filter(r => r.id && !postojeci.has(r.id));
  if (!novi.length) return;

  allFeaturesInWindow.push(...novi);
  novi.forEach(f => { delete f.__ocjena; });

  // Recenzije za nove retke - iste tablice, kljuc je ID retka.
  dohvatiRecenzije('zgrada_review', 'zgrada_id', novi.map(f => f.id))
    .then(mapa => {
      novi.forEach(f => {
        const r = mapa[f.id];
        f.reviewStatus = r ? r.status : 'nepotvrđeno';
        f.reviewNapomena = r ? r.napomena : null;
        f.reviewAzurirao = r ? r.azurirao : null;
        f.reviewAzuriranoAt = r ? r.azurirano_at : null;
      });
      updateTable();
    })
    .catch(() => { novi.forEach(f => { f.reviewStatus = 'nepotvrđeno'; }); updateTable(); });

  updateTable();
  updateMap();
  updateStats(ucitaniSkupovi);
  osvjeziBrojeveDokaza();
}

// ---------- Kompozitna stanja i tro-stanjni izvori ----------

function osvjeziFiltre(){
  Dnevnik.zapisi('pregled', 'filter_ocjene', {
    stanja: [...odabranaStanja],
    izvori: Object.keys(filtarIzvora).filter(k => filtarIzvora[k])
      .map(k => k + '=' + filtarIzvora[k])
  });
  updateTable();
  updateMap();
  updateStats(ucitaniSkupovi);
  osvjeziBrojeveDokaza();
}

// Rucna provjera. Isti oblik kao zetoni stanja, ali crtkani rub - da se na
// prvi pogled razlikuje ljudska presuda od strojnog zakljucka.
function crtajStatuse(){
  const spremnik = $('#statusRed');
  if (!spremnik) return;
  const svi = allFeaturesInWindow || [];

  const boje = {
    'nepotvrđeno': 'var(--text-faint)',
    'potvrđeno':   'var(--teal)',
    'odbačeno':    'var(--danger)',
  };
  const broj = {};
  svi.forEach(f => {
    const st = f.reviewStatus || 'nepotvrđeno';
    broj[st] = (broj[st] || 0) + 1;
  });

  spremnik.innerHTML = '';
  ['nepotvrđeno', 'potvrđeno', 'odbačeno'].forEach(st => {
    const n = broj[st] || 0;
    const el = document.createElement('button');
    el.className = 'status-zeton' + (selectedStatuses.has(st) ? ' aktivan' : '');
    el.style.color = selectedStatuses.has(st) ? boje[st] : '';
    el.title = 'Ručna provjera: ' + st;
    el.innerHTML = '<span class="tocka" style="width:7px;height:7px;border-radius:50%;background:'
      + boje[st] + '"></span>' + st.charAt(0).toUpperCase() + st.slice(1)
      + ' <span class="cnt">' + n + '</span>';
    el.addEventListener('click', () => {
      if (selectedStatuses.has(st)) selectedStatuses.delete(st);
      else selectedStatuses.add(st);
      crtajStatuse();
      crtajAktivneFiltre();
      osvjeziFiltre();
    });
    spremnik.appendChild(el);
  });
}

// Zetoni stanja - ILI-logika. Klik ukljucuje/iskljucuje stanje.
function crtajStanja(){
  const spremnik = $('#stanjaRed');
  if (!spremnik) return;
  const svi = allFeaturesInWindow || [];

  // Brojimo uz primijenjen filtar IZVORA, ali bez filtra stanja - inace bi
  // klik na jedno stanje nulirao brojeve svih ostalih.
  const podSkup = svi.filter(f => Ocjena.prolaziFiltar(ocjenaZa(f).dokazi, filtarIzvora));
  const brojPo = {};
  podSkup.forEach(f => { const s = ocjenaZa(f).stanje; brojPo[s] = (brojPo[s] || 0) + 1; });

  spremnik.innerHTML = '';
  Ocjena.STANJA.forEach(st => {
    const n = brojPo[st.kljuc] || 0;
    const el = document.createElement('button');
    el.className = 'stanje-zeton'
      + (odabranaStanja.has(st.kljuc) ? ' aktivan' : '')
      + (n === 0 ? ' prazan' : '');
    el.style.color = odabranaStanja.has(st.kljuc) ? st.boja : '';
    el.title = st.opis;
    el.innerHTML = '<span class="tocka" style="background:' + st.boja + '"></span>'
      + st.naziv + ' <span class="cnt">' + n + '</span>';
    el.addEventListener('click', () => {
      if (odabranaStanja.has(st.kljuc)) odabranaStanja.delete(st.kljuc);
      else odabranaStanja.add(st.kljuc);
      crtajStanja();
      osvjeziFiltre();
    });
    spremnik.appendChild(el);
  });
}

// Izvori - tri stanja u krug: null -> 'da' -> 'ne' -> null.
function crtajIzvore(){
  const blok = $('#izvoriBlok');
  if (!blok) return;
  const svi = allFeaturesInWindow || [];

  // Stari redci (osim naslova) se brisu i crtaju iznova.
  [...blok.querySelectorAll('.izvor-red')].forEach(e => e.remove());

  Ocjena.IZVORI.forEach(izv => {
    let da = 0, ne = 0, nep = 0;
    svi.forEach(f => {
      const v = ocjenaZa(f).dokazi[izv.kljuc];
      if (v === Ocjena.DA) da++;
      else if (v === Ocjena.NE) ne++;
      else nep++;
    });

    const stanje = filtarIzvora[izv.kljuc];
    const red = document.createElement('div');
    red.className = 'izvor-red';
    if (stanje) red.setAttribute('data-stanje', stanje);
    red.title = izv.opis + '\n\nKlik: ne filtriraj → ima dokaz → nema dokaza';
    red.innerHTML =
      '<span class="izvor-kvad">' + (stanje === 'da' ? '✓' : stanje === 'ne' ? '✕' : '') + '</span>' +
      '<span class="izvor-naziv">' + izv.naziv + '</span>' +
      '<span class="izvor-brojevi">' + da + ' / ' + ne +
        (nep ? ' <span class="nepoznato">(' + nep + ' ?)</span>' : '') + '</span>';

    red.addEventListener('click', () => {
      const sad = filtarIzvora[izv.kljuc];
      filtarIzvora[izv.kljuc] = sad === null ? 'da' : sad === 'da' ? 'ne' : null;
      crtajIzvore();
      crtajStanja();
      osvjeziFiltre();
    });
    blok.appendChild(red);
  });
}

// Zajednicko osvjezavanje obje osi.
function osvjeziBrojeveDokaza(){
  crtajStanja();
  crtajIzvore();
  crtajStatuse();
}


function redakZaIzvoz(f){
  return {
    Adresa: prikazAdrese(f) || '',
    Mjesto: tag(f,'addr:city') || (f.dguAdresa ? f.dguAdresa.settlement : '') || '',
    Zupanija: f.zupanija || '',
    Tip: tag(f,'building') || '',
    Datum: formatDatum(f.validFrom),
    Status: f.reviewStatus || 'nepotvrđeno',
    'Google Maps': f.lat !== null && f.lon !== null
      ? 'https://www.google.com/maps/search/?api=1&query=' + f.lat + ',' + f.lon
      : '',
    Lat: f.lat,
    Lon: f.lon,
  };
}

function nazivDatoteke(){
  const danas = new Date();
  const datum = danas.getFullYear() + '-' + String(danas.getMonth()+1).padStart(2,'0') + '-' + String(danas.getDate()).padStart(2,'0');
  return 'ng-' + datum + '.xlsx';
}

function sanitizirajNazivSheeta(naziv){
  // Excel ograničenja: max 31 znak, bez : \ / ? * [ ]
  return naziv.replace(/[:\\\/\?\*\[\]]/g, '').slice(0, 31);
}

function izvrsiIzvoz(samoOveZupanije){
  const sveOznamke = getFilteredFeaturesBezZupanije();
  const poZupaniji = {};
  sveOznamke.forEach(f => {
    const naziv = f.zupanija || 'Nepoznato';
    if (samoOveZupanije && !samoOveZupanije.has(naziv)) return;
    (poZupaniji[naziv] = poZupaniji[naziv] || []).push(f);
  });

  const wb = XLSX.utils.book_new();
  const poredaneZupanije = Object.keys(poZupaniji).sort((a,b) => a.localeCompare(b, 'hr'));

  if (poredaneZupanije.length === 0){
    alert('Nema podataka za izvoz s trenutnim filterima.');
    return;
  }

  let ukupnoRedaka = 0;
  poredaneZupanije.forEach(naziv => {
    const rows = poZupaniji[naziv].map(redakZaIzvoz);
    ukupnoRedaka += rows.length;
    const ws = XLSX.utils.json_to_sheet(rows);
    XLSX.utils.book_append_sheet(wb, ws, sanitizirajNazivSheeta(naziv));
  });

  Dnevnik.zapisi('pregled', 'izvoz_excel', {
    vrsta: 'po_zupanijama',
    broj_redaka: ukupnoRedaka,
    zupanije: poredaneZupanije,
    datoteka: nazivDatoteke()
  });
  Dnevnik.isprazni();
  XLSX.writeFile(wb, nazivDatoteke());
}

// Izvozi TOČNO ono što je trenutno prikazano u tablici - poštuje SVE
// aktivne filtere (županije, tip, katovi, satelit, DGU, pretraga), jedan
// sheet umjesto podjele po županijama.
function izvrsiIzvozTrenutnaLista(){
  const rows = getFilteredFeatures().map(redakZaIzvoz);
  if (rows.length === 0){
    alert('Nema podataka za izvoz s trenutnim filterima.');
    return;
  }
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.json_to_sheet(rows);
  XLSX.utils.book_append_sheet(wb, ws, 'Nove zgrade');
  Dnevnik.zapisi('pregled', 'izvoz_excel', {
    vrsta: 'trenutna_lista',
    broj_redaka: rows.length,
    datoteka: nazivDatoteke()
  });
  Dnevnik.isprazni();
  XLSX.writeFile(wb, nazivDatoteke());
}

function imaAktivnihFiltera(){
  return selectedZupanije.size > 0 || selectedBuildingTypes.size > 0 || selectedLevels.size > 0
    || odabranaStanja.size > 0
    || Object.keys(filtarIzvora).some(k => filtarIzvora[k])
    || (($('#searchBox').value || '').trim() !== '');
}

function otvoriIzborZupanijaModal(){
  const dijeloviOpisa = [];
  if (selectedZupanije.size > 0) dijeloviOpisa.push(selectedZupanije.size + ' županija');
  if (selectedBuildingTypes.size > 0) dijeloviOpisa.push(selectedBuildingTypes.size + ' tip(ova) zgrade');
  if (selectedLevels.size > 0) dijeloviOpisa.push('katovi');
  if (odabranaStanja.size > 0) {
    dijeloviOpisa.push([...odabranaStanja]
      .map(k => (Ocjena.stanjePoKljucu(k) || {}).naziv || k).join(', '));
  }
  Object.keys(filtarIzvora).forEach(k => {
    if (!filtarIzvora[k]) return;
    const izv = Ocjena.IZVORI.find(i => i.kljuc === k);
    dijeloviOpisa.push((izv ? izv.naziv : k) + (filtarIzvora[k] === 'da' ? ': ima' : ': nema'));
  });
  if (($('#searchBox').value || '').trim()) dijeloviOpisa.push('pretraga "' + $('#searchBox').value.trim() + '"');

  let gumbi = '<button class="modal-choice-btn" id="izvozTrenutnaListaBtn">Trenutna lista<span class="sub">Točno kako je prikazano - svi aktivni filteri, jedan list</span></button>';
  if (selectedZupanije.size > 0) {
    gumbi += '<button class="modal-choice-btn" id="izvozSamoOdabraneBtn">Samo odabrane županije<span class="sub">' + Array.from(selectedZupanije).join(', ') + ' - po sheetovima, ostali filteri i dalje vrijede</span></button>';
  }
  gumbi += '<button class="modal-choice-btn" id="izvozSveBtn">Sve županije<span class="sub">Svaka županija u zasebnom sheetu, ostali filteri i dalje vrijede</span></button>';

  $('#modalCard').innerHTML =
    '<button class="modal-close" id="modalCloseBtn">×</button>' +
    '<h3>Izvoz u Excel</h3>' +
    '<div style="color:var(--text-secondary);font-size:13.5px;margin-top:4px;">Aktivni filteri: ' + dijeloviOpisa.join(', ') + '. Što želiš izvesti?</div>' +
    gumbi;
  $('#modalOverlay').classList.add('open');

  $('#izvozTrenutnaListaBtn').addEventListener('click', () => {
    $('#modalOverlay').classList.remove('open');
    izvrsiIzvozTrenutnaLista();
  });
  const samoOdabraneBtn = document.getElementById('izvozSamoOdabraneBtn');
  if (samoOdabraneBtn) {
    samoOdabraneBtn.addEventListener('click', () => {
      $('#modalOverlay').classList.remove('open');
      izvrsiIzvoz(new Set(selectedZupanije));
    });
  }
  $('#izvozSveBtn').addEventListener('click', () => {
    $('#modalOverlay').classList.remove('open');
    izvrsiIzvoz(null);
  });
}

$('#exportBtn').addEventListener('click', () => {
  if (imaAktivnihFiltera()) {
    otvoriIzborZupanijaModal();
  } else {
    izvrsiIzvoz(null);
  }
});

<style>

<script>
const FEATURES = ${featuresJson};
const ZUPANIJE = ${zupanijeJson};
const DGU_BASE_URL = ${JSON.stringify(dguBaseUrl)};
const DGU_NOVE_ADRESE_BASE_URL = ${JSON.stringify(dguNoveAdreseBaseUrl)};
let selectedZup = new Set();
let selectedBuilding = new Set();
let selectedLevels = new Set();
let samoSatelitskiKandidatiDM = false;
let samoViseDguAdresaDM = false;

function tag(f,k){ return (f.tags && f.tags[k]) || null; }
function slug(naziv){
  return naziv.replace(/đ/g,'dj').replace(/Đ/g,'Dj').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
}

const map = L.map('map', { zoomControl: true }).setView([45.15, 16.8], 7);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap contributors', maxZoom: 19 }).addTo(map);
L.geoJSON(ZUPANIJE, { style: { color: '#3388ff', weight: 1, fillOpacity: 0, opacity: 0.35 } }).addTo(map);

// Zgrade (obrisi/tocke) - UVIJEK vidljive, DGU sloj ih nikad ne sakriva
const cluster = L.markerClusterGroup({ maxClusterRadius: 40, disableClusteringAtZoom: 15 });
map.addLayer(cluster);

// DGU adresne tocke - odvojen sloj, po zupaniji (GitHub Release asset), ucitava se
// samo za trenutno VIDLJIVE zupanije (ne skida se cijela drzava odjednom).
// Vec ucitane zupanije se pamte (dguLoadedZup) da se ne skidaju ponovno.
const dguCluster = L.markerClusterGroup({ chunkedLoading: true, maxClusterRadius: 60 });
let dguLoadedZup = new Set();
let dguEnabled = false;

document.getElementById('dguToggle').addEventListener('change', (e) => {
  dguEnabled = e.target.checked;
  if (dguEnabled) { map.addLayer(dguCluster); ucitajDguZaVidljive(); }
  else { map.removeLayer(dguCluster); }
});

async function ucitajDguZaVidljive(){
  const statusEl = document.getElementById('dguStatus');
  const vidljiveZup = ZUPANIJE.features.map(f => f.properties.naziv).filter(n => !selectedZup.has(n));
  const zaUcitati = vidljiveZup.filter(n => !dguLoadedZup.has(n));
  if (!zaUcitati.length) { statusEl.textContent = ''; return; }

  let ucitano = 0;
  for (const naziv of zaUcitati) {
    statusEl.textContent = 'Učitavam DGU adrese: ' + naziv + '... (' + (ucitano+1) + '/' + zaUcitati.length + ')';
    try {
      const res = await fetch(DGU_BASE_URL + slug(naziv) + '.geojson');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const gj = await res.json();
      gj.features.forEach(f => {
        const c = f.geometry.coordinates, p = f.properties;
        const m = L.circleMarker([c[1], c[0]], { radius: 5, color: '#2E7DE6', fillColor: '#2E7DE6', fillOpacity: 0.85, weight: 1 });
        const label = (p.street || '') + ' ' + (p.houseNumber || '');
        m.bindPopup('<b>' + label + '</b><br>' + (p.settlement || '') + ' ' + (p.postcode || '') + ' ' + (p.city || '') + '<br><i style="color:#888">DGU adresa</i>');
        dguCluster.addLayer(m);
      });
      dguLoadedZup.add(naziv);
    } catch (err) {
      console.warn('DGU adrese nisu dostupne za ' + naziv + ':', err.message);
    }
    ucitano++;
  }
  statusEl.textContent = 'DGU adrese učitane za ' + dguLoadedZup.size + '/' + ZUPANIJE.features.length + ' županija.';
}
