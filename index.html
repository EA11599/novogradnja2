<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Novogradnja — praćenje novih zgrada u Hrvatskoj</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg: #F0EFED;
    --card: #FFFFFF;
    --accent: #E8871E;
    --accent-dark: #B6650C;
    --accent-tint: #FCEBD4;
    --text: #1A1A1A;
    --text-secondary: #6B6B6B;
    --text-tertiary: #9B9894;
    --border: #E2E0DC;
    --radius: 14px;
    --radius-sm: 8px;
    --shadow: 0 1px 3px rgba(20,18,14,0.06), 0 1px 2px rgba(20,18,14,0.05);
    --shadow-lg: 0 8px 24px rgba(20,18,14,0.08), 0 2px 6px rgba(20,18,14,0.05);
    --font-display: 'Inter', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  a{ color: var(--accent-dark); }

  /* ---------- nav ---------- */
  .site-nav{
    max-width: 1240px;
    margin: 0 auto;
    padding: 20px 24px 0;
    display:flex;
    gap:8px;
  }
  .site-nav-link{
    font-family: var(--font-mono);
    font-size: 13px;
    text-decoration:none;
    color: var(--text-secondary);
    padding: 7px 14px;
    border-radius: 999px;
    border: 1px solid transparent;
  }
  .site-nav-link.active{
    color: var(--accent-dark);
    background: var(--accent-tint);
    border-color: var(--accent);
  }
  .site-nav-link:hover:not(.active){ color: var(--text); }

  /* ---------- header ---------- */
  header.hero{
    max-width: 1240px;
    margin: 0 auto;
    padding: 28px 24px 8px;
  }
  header.hero h1{
    font-family: var(--font-display);
    font-optical-sizing: auto;
    font-size: clamp(30px, 4vw, 42px);
    font-weight: 800;
    margin: 0 0 8px;
    letter-spacing: -0.025em;
  }
  header.hero p{
    color: var(--text-secondary);
    font-size: 16px;
    max-width: 640px;
    margin: 0;
  }
  .updated-tag{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-family: var(--font-mono);
    font-size: 12.5px;
    color: var(--text-secondary);
    background: var(--card);
    border: 1px solid var(--border);
    padding: 6px 12px;
    border-radius: 999px;
    margin-top: 14px;
  }
  .updated-dot{
    width:7px; height:7px; border-radius:50%;
    background: #2E9E5B;
    flex-shrink:0;
  }

  main{
    max-width: 1240px;
    margin: 0 auto;
    padding: 20px 24px 60px;
  }

  /* ---------- controls ---------- */
  .controls-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:12px;
    margin: 18px 0;
  }
  .window-select{
    display:flex;
    gap:6px;
    background: var(--card);
    border: 1px solid var(--border);
    padding: 4px;
    border-radius: 999px;
    box-shadow: var(--shadow);
  }
  .window-btn{
    font-family: var(--font-body);
    font-size: 13.5px;
    font-weight: 600;
    border: none;
    background: transparent;
    color: var(--text-secondary);
    padding: 8px 16px;
    border-radius: 999px;
    cursor: pointer;
  }
  .window-btn.active{
    background: var(--text);
    color: #fff;
  }
  .window-btn:hover:not(.active){ color: var(--text); }

  /* ---------- stat cards ---------- */
  .stats-grid{
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    margin-bottom: 18px;
  }
  .stat-card{
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 22px;
    box-shadow: var(--shadow);
  }
  .stat-label{
    font-size: 12.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-tertiary);
    margin-bottom: 10px;
  }
  .stat-value{
    font-family: var(--font-mono);
    font-size: 30px;
    font-weight: 600;
    color: var(--text);
  }
  .stat-value .unit{
    font-size: 15px;
    font-weight: 500;
    color: var(--text-secondary);
    margin-left: 4px;
  }

  /* ---------- main grid: map + sidebar ---------- */
  .content-grid{
    display:grid;
    grid-template-columns: 1fr 340px;
    gap: 16px;
    align-items: start;
  }
  .panel{
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow:hidden;
  }
  .panel-header{
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .panel-title{
    font-family: var(--font-display);
    font-weight: 700;
    letter-spacing: -0.01em;
    font-size: 16px;
  }
  #map{ height: 520px; width: 100%; background: #E9E7E2; }

  .legend{
    display:flex;
    align-items:center;
    gap:6px;
    font-family: var(--font-mono);
    font-size: 11.5px;
    color: var(--text-secondary);
  }
  .legend-swatch{ width:12px; height:12px; border-radius:3px; }

  /* sidebar county list */
  .zup-list{
    max-height: 520px;
    overflow-y: auto;
  }
  .zup-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding: 11px 20px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    user-select: none;
  }
  .zup-row:last-child{ border-bottom:none; }
  .zup-row:hover{ background: #FAFAF9; }
  .zup-row input[type=checkbox]{
    accent-color: var(--accent);
    width:16px; height:16px; flex-shrink:0;
  }
  .zup-name{
    flex:1;
    font-size: 13.5px;
    font-weight: 500;
    color: var(--text);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .zup-count{
    font-family: var(--font-mono);
    font-size: 12.5px;
    font-weight: 600;
    color: var(--accent-dark);
    background: var(--accent-tint);
    padding: 2px 8px;
    border-radius: 999px;
    min-width: 30px;
    text-align:center;
  }
  .zup-count.zero{
    color: var(--text-tertiary);
    background: transparent;
  }

  /* ---------- building list ---------- */
  .list-section{ margin-top: 16px; }
  .list-toolbar{
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display:flex;
    gap:10px;
    align-items:center;
    flex-wrap:wrap;
  }
  .search-input{
    flex:1;
    min-width: 220px;
    font-family: var(--font-body);
    font-size: 14px;
    padding: 9px 14px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--bg);
    color: var(--text);
  }
  .search-input:focus{ outline: 2px solid var(--accent); outline-offset: -1px; }
  .btn-export{
    font-family: var(--font-body);
    font-size: 13.5px;
    font-weight: 600;
    padding: 9px 16px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    cursor: pointer;
    white-space: nowrap;
  }
  .btn-export:hover{ border-color: var(--accent); color: var(--accent-dark); }

  table.building-table{
    width:100%;
    border-collapse: collapse;
    font-size: 13.5px;
  }
  .building-table th{
    text-align:left;
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-tertiary);
    font-weight: 600;
    padding: 10px 20px;
    border-bottom: 1px solid var(--border);
    background: #FAFAF9;
  }
  .building-table td{
    padding: 11px 20px;
    border-bottom: 1px solid var(--border);
    color: var(--text);
  }
  .building-table tr:last-child td{ border-bottom:none; }
  .building-table tr:hover td{ background: #FAFAF9; }
  .muted{ color: var(--text-tertiary); }
  .approx-addr{ font-style: italic; color: var(--text-secondary); }
  .badge-tip{
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 2px 7px;
    border-radius: 5px;
    background: var(--accent-tint);
    color: var(--accent-dark);
  }
  .list-footer{
    padding: 12px 20px;
    font-size: 12.5px;
    color: var(--text-tertiary);
    font-family: var(--font-mono);
  }
  .empty-state{
    padding: 60px 20px;
    text-align:center;
    color: var(--text-secondary);
  }
  .empty-state .big{
    font-family: var(--font-display);
    font-size: 18px;
    color: var(--text);
    margin-bottom: 6px;
  }

  /* ---------- facet filteri (tip zgrade / katovi) ---------- */
  .filter-toggle-row{
    padding: 10px 20px;
    border-bottom: 1px solid var(--border);
    display:flex;
    gap: 10px;
    align-items:center;
    flex-wrap: wrap;
  }
  .filter-toggle-btn{
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 600;
    padding: 7px 14px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text-secondary);
    cursor: pointer;
  }
  .filter-toggle-btn.has-active{
    border-color: var(--accent);
    color: var(--accent-dark);
    background: var(--accent-tint);
  }
  .facet-panel{
    display:none;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    background: #FAFAF9;
    gap: 24px;
    flex-wrap: wrap;
  }
  .facet-panel.open{ display:flex; }
  .facet-group{ min-width: 180px; }
  .facet-group-title{
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-tertiary);
    font-weight: 700;
    margin-bottom: 8px;
  }
  .facet-opt{
    display:flex;
    align-items:center;
    gap:8px;
    font-size: 13px;
    padding: 3px 0;
    cursor:pointer;
  }
  .facet-opt input{ accent-color: var(--accent); }
  .facet-opt .fc{
    margin-left:auto;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-tertiary);
  }

  /* ---------- modal (detalji zgrade) ---------- */
  .modal-overlay{
    display:none;
    position: fixed; inset: 0;
    background: rgba(20,18,14,0.45);
    z-index: 1000;
    align-items:center;
    justify-content:center;
    padding: 20px;
  }
  .modal-overlay.open{ display:flex; }
  .modal-card{
    background: var(--card);
    border-radius: var(--radius);
    max-width: 420px;
    width: 100%;
    box-shadow: var(--shadow-lg);
    padding: 24px;
    max-height: 80vh;
    overflow-y:auto;
  }
  .modal-card h3{
    font-family: var(--font-display);
    font-weight: 800;
    letter-spacing: -0.01em;
    margin: 0 0 4px;
    font-size: 19px;
  }
  .modal-close{
    float:right;
    background:none;
    border:none;
    font-size: 20px;
    color: var(--text-secondary);
    cursor:pointer;
    line-height:1;
  }
  .modal-tags{
    font-family: var(--font-mono);
    font-size: 12px;
    color: #444;
    background: var(--bg);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    margin-top: 12px;
  }
  .modal-gmaps{
    display:inline-block;
    margin-top: 10px;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--accent-dark);
    text-decoration:none;
  }
  .building-table tbody tr{ cursor: pointer; }

  @media (max-width: 900px){
    .content-grid{ grid-template-columns: 1fr; }
    .stats-grid{ grid-template-columns: 1fr 1fr; }
    #map{ height: 360px; }
    .zup-list{ max-height: 320px; }
  }
  @media (max-width: 520px){
    .stats-grid{ grid-template-columns: 1fr; }
  }

  :focus-visible{ outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>

<div class="site-nav">
  <a href="index.html" class="site-nav-link active">Usporedba zgrada</a>
  <!-- Dozvole privremeno isključene iz navigacije dok se ne usavrši ekstrakcija PDF-ova. Stranica ostaje u repozitoriju za kasnije. -->
</div>

<header class="hero">
  <h1>Nove zgrade u Hrvatskoj</h1>
  <p>Automatsko tjedno praćenje novoizgrađenih objekata na temelju OpenStreetMap podataka, po županijama.</p>
  <div class="updated-tag" id="updatedTag"><span class="updated-dot"></span> Učitavanje...</div>
</header>

<main>
  <div class="controls-row">
    <div class="window-select" id="windowSelect"><!-- popunjava JS --></div>
  </div>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-label">Nove zgrade</div>
      <div class="stat-value" id="statTotal">–</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Tjedni prosjek</div>
      <div class="stat-value" id="statAvg">–</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Aktivne županije</div>
      <div class="stat-value" id="statZupanije">–<span class="unit">/ 21</span></div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Zadnje ažurirano</div>
      <div class="stat-value" id="statUpdated" style="font-size:20px;">–</div>
    </div>
  </div>

  <div class="content-grid">
    <div class="panel">
      <div class="panel-header">
        <div class="panel-title">Karta aktivnosti</div>
        <div style="display:flex;align-items:center;gap:14px;">
          <div class="legend" id="legend"></div>
          <button class="btn-export" id="detailMapBtn" style="padding:7px 14px;">Pogledaj detaljnije →</button>
        </div>
      </div>
      <div id="map"></div>
    </div>
    <div class="panel">
      <div class="panel-header">
        <div class="panel-title">Županije</div>
        <button class="btn-export" id="clearZupBtn" style="padding:5px 10px;font-size:12px;">Poništi</button>
      </div>
      <div class="zup-list" id="zupList"><!-- popunjava JS --></div>
    </div>
  </div>

  <div class="panel list-section">
    <div class="list-toolbar">
      <input type="text" class="search-input" id="searchBox" placeholder="Pretraži po adresi, mjestu ili županiji...">
      <button class="filter-toggle-btn" id="facetToggleBtn">Filteri ▾</button>
      <button class="btn-export" id="exportBtn">Izvoz u Excel</button>
    </div>
    <div class="facet-panel" id="facetPanel"></div>
    <div id="tableWrap"></div>
    <div class="list-footer" id="listFooter"></div>
  </div>
</main>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-card" id="modalCard"></div>
</div>

<script>
const $ = (sel) => document.querySelector(sel);
function tag(f, k){ return (f.tags && f.tags[k]) || null; }

// Najbliža cesta se računa u pipeline-u (GitHub Actions), NE ovdje —
// izravni pozivi prema Overpass-u iz preglednika s GitHub Pages domene
// blokirani su CORS politikom servera. Ovdje samo čitamo gotov podatak
// koji je pipeline već spremio (f.nearestStreet / f.nearestStreetDist).
function prikazAdrese(f){
  const prava = [tag(f,'addr:street'), tag(f,'addr:housenumber')].filter(Boolean).join(' ');
  if (prava) return prava;
  if (f.dguAdresa) return [f.dguAdresa.street, f.dguAdresa.houseNumber].filter(Boolean).join(' ');
  if (f.nearestStreet) return '~' + f.nearestStreetDist + 'm od ' + f.nearestStreet;
  return null;
}
// "Približna" = samo procjena (najbliža cesta). DGU adresa je point-in-polygon
// potvrđena (DGU točka je doslovno unutar obrisa zgrade), pa se NE tretira
// kao približna, iako nije izvorno iz OSM-a.
function jeAdresaPriblizna(f){
  const prava = [tag(f,'addr:street'), tag(f,'addr:housenumber')].filter(Boolean).join(' ');
  return !prava && !f.dguAdresa && !!f.nearestStreet;
}
function jeAdresaIzDgu(f){
  const prava = [tag(f,'addr:street'), tag(f,'addr:housenumber')].filter(Boolean).join(' ');
  return !prava && !!f.dguAdresa;
}


let manifest = null;
let zupanijeGeo = null;
let cachedChunks = {};      // file -> parsed diff data
let allFeaturesInWindow = []; // trenutno spojene zgrade za odabrani prozor
let selectedZupanije = new Set(); // prazan set = sve prikazane
let selectedBuildingTypes = new Set();
let selectedLevels = new Set();
let facetPanelOpen = false;
let map, geoLayer, markerLayer;
let currentWindowWeeks = null; // null = sve

const WINDOW_OPTIONS = [
  { label: '1 tjedan', weeks: 1 },
  { label: '4 tjedna', weeks: 4 },
  { label: '3 mjeseca', weeks: null }, // null = sve dostupno (cijela retencija)
];

async function init(){
  const [manifestRes, zupRes] = await Promise.all([
    fetch('data/zgrade/manifest.json', { cache: 'no-store' }),
    fetch('data/zupanije.geojson', { cache: 'no-store' }),
  ]);
  manifest = await manifestRes.json();
  zupanijeGeo = await zupRes.json();

  renderWindowButtons();
  initMap();

  const zadnji = manifest.entries[manifest.entries.length - 1];
  if (zadnji){
    $('#updatedTag').innerHTML = '<span class="updated-dot"></span> Zadnje ažuriranje: ' + formatDatum(zadnji.to);
  } else {
    $('#updatedTag').innerHTML = '<span class="updated-dot"></span> Još nema podataka';
  }

  // default: prikaži sve dostupno
  await selectWindow(null);
}

function renderWindowButtons(){
  const wrap = $('#windowSelect');
  wrap.innerHTML = '';
  WINDOW_OPTIONS.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'window-btn' + (i === WINDOW_OPTIONS.length - 1 ? ' active' : '');
    btn.textContent = opt.label;
    btn.addEventListener('click', () => {
      document.querySelectorAll('.window-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectWindow(opt.weeks);
    });
    wrap.appendChild(btn);
  });
}

function entriesForWindow(weeks){
  if (!manifest.entries.length) return [];
  if (weeks === null) return manifest.entries.slice();
  const cutoff = new Date(manifest.entries[manifest.entries.length - 1].to);
  cutoff.setUTCDate(cutoff.getUTCDate() - weeks * 7);
  return manifest.entries.filter(e => new Date(e.to) > cutoff);
}

async function selectWindow(weeks){
  currentWindowWeeks = weeks;
  const entries = entriesForWindow(weeks);

  const dataSets = await Promise.all(entries.map(async (e) => {
    if (!cachedChunks[e.file]){
      const res = await fetch(e.file, { cache: 'no-store' });
      cachedChunks[e.file] = await res.json();
    }
    return cachedChunks[e.file];
  }));

  allFeaturesInWindow = [];
  dataSets.forEach(d => allFeaturesInWindow.push(...d.features));
  selectedBuildingTypes.clear();
  selectedLevels.clear();

  updateStats(entries);
  updateZupanijeList();
  updateMap();
  updateTable();
  if (facetPanelOpen) renderFacetPanel();
}

function updateStats(entries){
  $('#statTotal').textContent = allFeaturesInWindow.length.toLocaleString('hr-HR');
  const tjedana = Math.max(entries.length, 1);
  $('#statAvg').textContent = Math.round(allFeaturesInWindow.length / tjedana).toLocaleString('hr-HR');

  const counts = countByZupanija(allFeaturesInWindow);
  const aktivne = Object.keys(counts).filter(z => counts[z] > 0).length;
  $('#statZupanije').innerHTML = aktivne + '<span class="unit">/ 21</span>';

  const zadnji = entries[entries.length - 1];
  $('#statUpdated').textContent = zadnji ? formatDatum(zadnji.to) : '–';
}

function countByZupanija(features){
  const counts = {};
  zupanijeGeo.features.forEach(f => counts[f.properties.naziv] = 0);
  features.forEach(f => {
    if (f.zupanija) counts[f.zupanija] = (counts[f.zupanija] || 0) + 1;
  });
  return counts;
}

function initMap(){
  map = L.map('map', { scrollWheelZoom: false }).setView([45.15, 16.8], 7);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    attribution: '© OpenStreetMap, © CARTO',
    maxZoom: 18,
  }).addTo(map);
  geoLayer = L.geoJSON(null).addTo(map);
  markerLayer = L.layerGroup().addTo(map);
}

function colorScale(count, max){
  if (count === 0 || max === 0) return '#EDEBE7';
  // log skala jer razlika izmedu tjedana zna biti velika (npr. bulk-import tjedan)
  const t = Math.log(count + 1) / Math.log(max + 1);
  // interpolacija izmedu blijedo-narancaste i tamno-narancaste
  const lo = [252, 235, 212]; // --accent-tint
  const hi = [182, 101, 12];  // --accent-dark
  const rgb = lo.map((c, i) => Math.round(c + (hi[i] - c) * t));
  return 'rgb(' + rgb.join(',') + ')';
}

function updateMap(){
  const counts = countByZupanija(allFeaturesInWindow);
  const max = Math.max(...Object.values(counts), 1);

  geoLayer.clearLayers();
  geoLayer.addData(zupanijeGeo);
  geoLayer.setStyle((f) => {
    const c = counts[f.properties.naziv] || 0;
    const isFiltered = selectedZupanije.size > 0 && !selectedZupanije.has(f.properties.naziv);
    return {
      fillColor: colorScale(c, max),
      fillOpacity: isFiltered ? 0.25 : 0.85,
      color: '#fff',
      weight: 1.5,
      opacity: 1,
    };
  });
  geoLayer.eachLayer((layer) => {
    const naziv = layer.feature.properties.naziv;
    const c = counts[naziv] || 0;
    layer.bindTooltip(naziv + ': ' + c + ' novih zgrada', { sticky: true });
    layer.on('click', () => toggleZupanija(naziv));
  });

  // legenda
  $('#legend').innerHTML =
    '<span class="legend-swatch" style="background:' + colorScale(0, max) + '"></span>0' +
    '<span class="legend-swatch" style="background:' + colorScale(max, max) + ';margin-left:8px;"></span>' + max;

  // markeri pojedinačnih zgrada (prikazujemo do razumne granice radi performansi)
  markerLayer.clearLayers();
  const filtered = getFilteredFeatures();
  const MAX_MARKERA = 1500;
  filtered.slice(0, MAX_MARKERA).forEach(f => {
    if (f.lat === null || f.lon === null) return;
    const m = L.circleMarker([f.lat, f.lon], {
      radius: 4,
      color: '#B6650C',
      weight: 1,
      fillColor: '#E8871E',
      fillOpacity: 0.85,
    });
    m.bindPopup(opisZgrade(f));
    markerLayer.addLayer(m);
  });
}

function opisZgrade(f){
  const adresa = prikazAdrese(f) || 'Adresa nepoznata';
  const adresaStil = jeAdresaPriblizna(f) ? ' style="font-style:italic;color:#6B6B6B;"' : '';
  const dguNapomena = jeAdresaIzDgu(f) ? ' <span style="font-size:10px;color:#6B6B6B;">(DGU)</span>' : '';
  const gmaps = 'https://www.google.com/maps/search/?api=1&query=' + f.lat + ',' + f.lon;
  const tagoviHtml = Object.entries(f.tags || {}).map(([k,v]) =>
    '<div>' + k + ' = ' + v + '</div>').join('');
  return '<div style="min-width:200px;">' +
    '<b' + adresaStil + '>' + adresa + '</b>' + dguNapomena + '<br>' +
    (tag(f,'addr:city') || '') + (f.zupanija ? ' · ' + f.zupanija : '') +
    '<div style="color:#6B6B6B;font-size:12px;margin:4px 0;">' + (tag(f,'building') || 'zgrada') + ' · ' + formatDatum(f.validFrom) + '</div>' +
    '<a href="' + gmaps + '" target="_blank" rel="noopener" style="font-size:12.5px;">Otvori u Google Maps ↗</a>' +
    '<details style="margin-top:6px;"><summary style="cursor:pointer;font-size:12px;color:#6B6B6B;">Svi podaci</summary>' +
    '<div style="font-family:var(--font-mono);font-size:11.5px;margin-top:4px;color:#444;">' + tagoviHtml + '</div></details>' +
    '</div>';
}

function toggleZupanija(naziv){
  if (selectedZupanije.has(naziv)) selectedZupanije.delete(naziv);
  else selectedZupanije.add(naziv);
  updateZupanijeList();
  updateMap();
  updateTable();
  if (facetPanelOpen) renderFacetPanel();
}

function updateZupanijeList(){
  const counts = countByZupanija(allFeaturesInWindow);
  const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);

  const wrap = $('#zupList');
  wrap.innerHTML = '';
  sorted.forEach(([naziv, count]) => {
    const row = document.createElement('div');
    row.className = 'zup-row';
    const checked = selectedZupanije.size === 0 || selectedZupanije.has(naziv);
    row.innerHTML =
      '<input type="checkbox" ' + (checked ? 'checked' : '') + '>' +
      '<span class="zup-name">' + naziv + '</span>' +
      '<span class="zup-count' + (count === 0 ? ' zero' : '') + '">' + count + '</span>';
    row.addEventListener('click', (e) => {
      if (e.target.tagName !== 'INPUT') toggleZupanija(naziv);
    });
    row.querySelector('input').addEventListener('click', (e) => {
      e.stopPropagation();
      toggleZupanija(naziv);
    });
    wrap.appendChild(row);
  });
}

$('#clearZupBtn').addEventListener('click', () => {
  selectedZupanije.clear();
  updateZupanijeList();
  updateMap();
  updateTable();
});

function getFilteredFeatures(){
  const q = ($('#searchBox').value || '').toLowerCase().trim();
  return allFeaturesInWindow.filter(f => {
    if (selectedZupanije.size > 0 && !selectedZupanije.has(f.zupanija)) return false;
    if (selectedBuildingTypes.size > 0 && !selectedBuildingTypes.has(tag(f,'building') || '(bez oznake)')) return false;
    if (selectedLevels.size > 0 && !selectedLevels.has(tag(f,'building:levels') || '(nepoznato)')) return false;
    if (!q) return true;
    const hay = [tag(f,'addr:street'), tag(f,'addr:housenumber'), tag(f,'addr:city'), f.zupanija, tag(f,'name'), tag(f,'building')]
      .filter(Boolean).join(' ').toLowerCase();
    return hay.includes(q);
  });
}

function facetCounts(features, key, fallback){
  const counts = {};
  features.forEach(f => {
    const v = tag(f, key) || fallback;
    counts[v] = (counts[v] || 0) + 1;
  });
  return Object.entries(counts).sort((a,b) => b[1] - a[1]);
}

function renderFacetPanel(){
  // facet opcije se računaju na skupu nakon zupanija+pretraga filtera, ali PRIJE
  // vlastite facet selekcije, tako da brojke ostanu smislene dok biraš opcije
  const baseline = allFeaturesInWindow.filter(f => {
    if (selectedZupanije.size > 0 && !selectedZupanije.has(f.zupanija)) return false;
    const q = ($('#searchBox').value || '').toLowerCase().trim();
    if (!q) return true;
    const hay = [tag(f,'addr:street'), tag(f,'addr:housenumber'), tag(f,'addr:city'), f.zupanija, tag(f,'name'), tag(f,'building')]
      .filter(Boolean).join(' ').toLowerCase();
    return hay.includes(q);
  });

  const buildingCounts = facetCounts(baseline, 'building', '(bez oznake)').slice(0, 10);
  const levelCounts = facetCounts(baseline, 'building:levels', '(nepoznato)')
    .sort((a,b) => (parseInt(a[0]) || 99) - (parseInt(b[0]) || 99)).slice(0, 10);

  const grupa = (naslov, entries, selectedSet) => {
    let html = '<div class="facet-group"><div class="facet-group-title">' + naslov + '</div>';
    entries.forEach(([val, count]) => {
      const checked = selectedSet.has(val);
      html += '<label class="facet-opt"><input type="checkbox" data-val="' + val.replace(/"/g,'&quot;') + '" ' + (checked ? 'checked' : '') + '>' +
        val + '<span class="fc">' + count + '</span></label>';
    });
    html += '</div>';
    return html;
  };

  const panel = $('#facetPanel');
  panel.innerHTML = grupa('Tip zgrade', buildingCounts, selectedBuildingTypes) + grupa('Katovi', levelCounts, selectedLevels);

  const groups = panel.querySelectorAll('.facet-group');
  groups[0].querySelectorAll('input').forEach(cb => cb.addEventListener('change', (e) => {
    toggleSet(selectedBuildingTypes, e.target.dataset.val);
    updateTable();
    updateMap();
  }));
  groups[1].querySelectorAll('input').forEach(cb => cb.addEventListener('change', (e) => {
    toggleSet(selectedLevels, e.target.dataset.val);
    updateTable();
    updateMap();
  }));

  $('#facetToggleBtn').classList.toggle('has-active', selectedBuildingTypes.size > 0 || selectedLevels.size > 0);
}

function toggleSet(set, val){
  if (set.has(val)) set.delete(val); else set.add(val);
}

$('#facetToggleBtn').addEventListener('click', () => {
  facetPanelOpen = !facetPanelOpen;
  $('#facetPanel').classList.toggle('open', facetPanelOpen);
  if (facetPanelOpen) renderFacetPanel();
});

function updateTable(){
  const filtered = getFilteredFeatures();
  const wrap = $('#tableWrap');

  if (filtered.length === 0){
    wrap.innerHTML = '<div class="empty-state"><div class="big">Nema rezultata</div>Pokušaj promijeniti razdoblje, županiju ili pretragu.</div>';
    $('#listFooter').textContent = '';
    return;
  }

  const MAX_REDAKA = 500;
  let html = '<table class="building-table"><thead><tr>' +
    '<th>Adresa</th><th>Mjesto</th><th>Županija</th><th>Tip</th><th>Datum</th>' +
    '</tr></thead><tbody>';

  const prikazano = filtered.slice(0, MAX_REDAKA);
  prikazano.forEach((f, i) => {
    const adresa = prikazAdrese(f);
    const adresaHtml = adresa
      ? (jeAdresaPriblizna(f) ? '<span class="approx-addr">' + adresa + '</span>'
        : jeAdresaIzDgu(f) ? adresa + ' <span class="badge-tip" style="font-size:10px;">DGU</span>'
        : adresa)
      : '<span class="muted">—</span>';
    html += '<tr data-idx="' + i + '">' +
      '<td>' + adresaHtml + '</td>' +
      '<td>' + (tag(f,'addr:city') || '<span class="muted">—</span>') + '</td>' +
      '<td>' + (f.zupanija ? '<span class="badge-tip">' + f.zupanija + '</span>' : '<span class="muted">—</span>') + '</td>' +
      '<td>' + (tag(f,'building') || '<span class="muted">—</span>') + '</td>' +
      '<td class="muted">' + formatDatum(f.validFrom) + '</td>' +
      '</tr>';
  });
  html += '</tbody></table>';
  wrap.innerHTML = html;

  wrap.querySelectorAll('tbody tr').forEach(tr => {
    tr.addEventListener('click', () => openModal(prikazano[+tr.dataset.idx]));
  });

  $('#listFooter').textContent = filtered.length > MAX_REDAKA
    ? 'Prikazano ' + MAX_REDAKA.toLocaleString('hr-HR') + ' od ' + filtered.length.toLocaleString('hr-HR') + ' — suzi pretragu za više detalja.'
    : filtered.length.toLocaleString('hr-HR') + ' zgrada';
}

function openModal(f){
  const adresa = prikazAdrese(f) || 'Adresa nepoznata';
  const adresaStil = jeAdresaPriblizna(f) ? ' style="font-style:italic;"' : '';
  const dguNapomena = jeAdresaIzDgu(f) ? ' <span style="font-size:11px;color:var(--text-secondary);font-weight:400;">(DGU)</span>' : '';
  const gmaps = 'https://www.google.com/maps/search/?api=1&query=' + f.lat + ',' + f.lon;
  const tagoviHtml = Object.entries(f.tags || {}).map(([k,v]) => '<div>' + k + ' = ' + v + '</div>').join('') || '<div class="muted">Nema dodatnih oznaka</div>';
  $('#modalCard').innerHTML =
    '<button class="modal-close" id="modalCloseBtn">×</button>' +
    '<h3' + adresaStil + '>' + adresa + dguNapomena + '</h3>' +
    '<div style="color:var(--text-secondary);font-size:13.5px;">' + (tag(f,'addr:city') || '') + (f.zupanija ? ' · ' + f.zupanija : '') + '</div>' +
    '<div style="color:var(--text-secondary);font-size:13px;margin-top:4px;">' + (tag(f,'building') || 'zgrada') + ' · ' + formatDatum(f.validFrom) + '</div>' +
    '<a class="modal-gmaps" href="' + gmaps + '" target="_blank" rel="noopener">Otvori u Google Maps ↗</a>' +
    '<div class="modal-tags">' + tagoviHtml + '</div>';
  $('#modalOverlay').classList.add('open');
}

$('#modalOverlay').addEventListener('click', (e) => {
  if (e.target.id === 'modalOverlay' || e.target.id === 'modalCloseBtn') {
    $('#modalOverlay').classList.remove('open');
  }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') $('#modalOverlay').classList.remove('open');
});

$('#searchBox').addEventListener('input', () => {
  updateTable();
  if (facetPanelOpen) renderFacetPanel();
});

$('#exportBtn').addEventListener('click', () => {
  const filtered = getFilteredFeatures();
  const rows = filtered.map(f => ({
    Adresa: [tag(f,'addr:street'), tag(f,'addr:housenumber')].filter(Boolean).join(' '),
    Mjesto: tag(f,'addr:city') || '',
    Zupanija: f.zupanija || '',
    Tip: tag(f,'building') || '',
    Datum: f.validFrom || '',
    Lat: f.lat,
    Lon: f.lon,
  }));
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Nove zgrade');
  XLSX.writeFile(wb, 'nove-zgrade.xlsx');
});

$('#detailMapBtn').addEventListener('click', () => {
  const html = buildDetailMapHtml(allFeaturesInWindow, zupanijeGeo);
  const blob = new Blob([html], { type: 'text/html' });
  window.open(URL.createObjectURL(blob), '_blank');
});

function buildDetailMapHtml(features, zupanije){
  const featuresJson = JSON.stringify(features.filter(f => f.lat !== null && f.lon !== null));
  const zupanijeJson = JSON.stringify(zupanije);
  const dguBaseUrl = new URL('data/dgu-adrese/', window.location.href).href;
  return `<!DOCTYPE html>
<html lang="hr"><head><meta charset="UTF-8">
<title>Nove zgrade — detaljna karta</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"><\/script>
<script src="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"><\/script>
<style>
  :root{
    --bg:#F0EFED; --card:#FFFFFF; --accent:#E8871E; --accent-dark:#B6650C; --accent-tint:#FCEBD4;
    --text:#1A1A1A; --text-secondary:#6B6B6B; --border:#E2E0DC;
    --font-display:'Inter',sans-serif; --font-body:'Inter',sans-serif; --font-mono:'IBM Plex Mono',monospace;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; font-family:var(--font-body); color:var(--text); }
  #app{ display:flex; height:100vh; }
  #sidebar{
    width:340px; flex-shrink:0; background:var(--card); border-right:1px solid var(--border);
    display:flex; flex-direction:column; overflow:hidden;
  }
  #sidebar-header{ padding:18px 20px; border-bottom:1px solid var(--border); }
  #sidebar-header h1{ font-family:var(--font-display); font-weight:800; letter-spacing:-0.02em; font-size:19px; margin:0 0 4px; }
  #sidebar-header p{ margin:0; font-size:12.5px; color:var(--text-secondary); font-family:var(--font-mono); }
  .search-input{ width:100%; font-family:var(--font-body); font-size:14px; padding:9px 12px; border:1px solid var(--border); border-radius:8px; background:var(--bg); color:var(--text); margin:14px 0 0; }
  .search-input:focus{ outline:2px solid var(--accent); outline-offset:-1px; }
  #filters{ flex:1; overflow-y:auto; padding: 6px 0; }
  .filter-group-title{ font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:#9B9894; font-weight:700; padding:12px 20px 6px; display:flex; justify-content:space-between; align-items:center; }
  .zup-row, .facet-row{ display:flex; align-items:center; gap:10px; padding:6px 20px; cursor:pointer; font-size:13px; }
  .zup-row:hover, .facet-row:hover{ background:#FAFAF9; }
  .zup-row input, .facet-row input{ accent-color:var(--accent); }
  .cnt{ margin-left:auto; font-family:var(--font-mono); font-size:11px; color:var(--accent-dark); background:var(--accent-tint); padding:1px 7px; border-radius:999px; }
  .extra-toggle-row{ padding:10px 20px; border-top:1px solid var(--border); font-size:13px; }
  .extra-toggle-row label{ display:flex; align-items:center; gap:8px; cursor:pointer; }
  .extra-toggle-row input{ accent-color:var(--accent); }
  .extra-toggle-row .note{ color:var(--text-secondary); font-size:11.5px; margin:4px 0 0 24px; }
  #roadsStatus{ font-size:11.5px; color:var(--text-secondary); margin-top:6px; min-height:14px; }
  #stats{ padding:14px 20px; border-top:1px solid var(--border); font-family:var(--font-mono); font-size:12.5px; color:var(--text-secondary); }
  #stats b{ color:var(--text); font-size:15px; }
  #map{ flex:1; }
  .leaflet-popup-content{ font-family:var(--font-body); font-size:13px; }
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div id="sidebar-header">
      <h1>Nove zgrade</h1>
      <p id="rangeLabel"></p>
      <input class="search-input" id="q" placeholder="Pretraži adresu, mjesto...">
    </div>
    <div id="filters">
      <div class="filter-group-title">Županije</div>
      <div id="zupList"></div>
      <div class="filter-group-title">Tip zgrade</div>
      <div id="buildingList"></div>
      <div class="filter-group-title">Katovi</div>
      <div id="levelsList"></div>
    </div>
    <div class="extra-toggle-row">
      <label><input type="checkbox" id="dguToggle"> Prikaži DGU adrese</label>
      <div class="note">Učitava se po županiji, samo za trenutno vidljive (ovisi o kvačicama iznad). Ažurira se mjesečno.</div>
      <div id="dguStatus" style="font-size:11.5px;color:var(--text-secondary);margin-top:4px;"></div>
    </div>
    <div id="stats"></div>
  </div>
  <div id="map"></div>
</div>
<script>
const FEATURES = ${featuresJson};
const ZUPANIJE = ${zupanijeJson};
const DGU_BASE_URL = ${JSON.stringify(dguBaseUrl)};
let selectedZup = new Set();
let selectedBuilding = new Set();
let selectedLevels = new Set();

function tag(f,k){ return (f.tags && f.tags[k]) || null; }
function slug(naziv){
  return naziv.replace(/đ/g,'dj').replace(/Đ/g,'Dj').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
}

const map = L.map('map', { zoomControl: true }).setView([45.15, 16.8], 7);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap contributors', maxZoom: 19 }).addTo(map);
L.geoJSON(ZUPANIJE, { style: { color: '#3388ff', weight: 1, fillOpacity: 0, opacity: 0.35 } }).addTo(map);

// Zgrade (obrisi/tocke) - UVIJEK vidljive, DGU sloj ih nikad ne sakriva
const cluster = L.markerClusterGroup({ maxClusterRadius: 40, disableClusteringAtZoom: 15 });
map.addLayer(cluster);

// DGU adresne tocke - odvojen sloj, po zupaniji (GitHub Release asset), ucitava se
// samo za trenutno VIDLJIVE zupanije (ne skida se cijela drzava odjednom).
// Vec ucitane zupanije se pamte (dguLoadedZup) da se ne skidaju ponovno.
const dguCluster = L.markerClusterGroup({ chunkedLoading: true, maxClusterRadius: 60 });
let dguLoadedZup = new Set();
let dguEnabled = false;

document.getElementById('dguToggle').addEventListener('change', (e) => {
  dguEnabled = e.target.checked;
  if (dguEnabled) { map.addLayer(dguCluster); ucitajDguZaVidljive(); }
  else { map.removeLayer(dguCluster); }
});

async function ucitajDguZaVidljive(){
  const statusEl = document.getElementById('dguStatus');
  const vidljiveZup = ZUPANIJE.features.map(f => f.properties.naziv).filter(n => !selectedZup.has(n));
  const zaUcitati = vidljiveZup.filter(n => !dguLoadedZup.has(n));
  if (!zaUcitati.length) { statusEl.textContent = ''; return; }

  let ucitano = 0;
  for (const naziv of zaUcitati) {
    statusEl.textContent = 'Učitavam DGU adrese: ' + naziv + '... (' + (ucitano+1) + '/' + zaUcitati.length + ')';
    try {
      const res = await fetch(DGU_BASE_URL + slug(naziv) + '.geojson');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const gj = await res.json();
      gj.features.forEach(f => {
        const c = f.geometry.coordinates, p = f.properties;
        const m = L.circleMarker([c[1], c[0]], { radius: 5, color: '#2E7DE6', fillColor: '#2E7DE6', fillOpacity: 0.85, weight: 1 });
        const label = (p.street || '') + ' ' + (p.houseNumber || '');
        m.bindPopup('<b>' + label + '</b><br>' + (p.settlement || '') + ' ' + (p.postcode || '') + ' ' + (p.city || '') + '<br><i style="color:#888">DGU adresa</i>');
        dguCluster.addLayer(m);
      });
      dguLoadedZup.add(naziv);
    } catch (err) {
      console.warn('DGU adrese nisu dostupne za ' + naziv + ':', err.message);
    }
    ucitano++;
  }
  statusEl.textContent = 'DGU adrese učitane za ' + dguLoadedZup.size + '/' + ZUPANIJE.features.length + ' županija.';
}

// Najbliža cesta se računa u pipeline-u (GitHub Actions), ne ovdje uživo —
// vidi scripts/lib/najbliza-cesta.js. Ovdje samo čitamo gotov podatak.

function opis(f){
  let adresa = [tag(f,'addr:street'), tag(f,'addr:housenumber')].filter(Boolean).join(' ');
  let dguNapomena = '';
  if (!adresa && f.dguAdresa) {
    adresa = [f.dguAdresa.street, f.dguAdresa.houseNumber].filter(Boolean).join(' ');
    dguNapomena = ' <span style="font-size:10px;color:#6B6B6B;">(DGU)</span>';
  }
  if (!adresa && f.nearestStreet) adresa = '~' + f.nearestStreetDist + 'm od ' + f.nearestStreet;
  if (!adresa) adresa = 'Adresa nepoznata';
  const gmaps = 'https://www.google.com/maps/search/?api=1&query=' + f.lat + ',' + f.lon;
  const tagoviHtml = Object.entries(f.tags || {}).map(([k,v]) => '<div>' + k + ' = ' + v + '</div>').join('');
  return '<div style="min-width:210px;">' +
    '<b>' + adresa + '</b>' + dguNapomena + '<br>' +
    (tag(f,'addr:city') || '') + (f.zupanija ? ' · ' + f.zupanija : '') +
    '<div style="color:#6B6B6B;font-size:12px;margin:4px 0;">' + (tag(f,'building') || 'zgrada') + (f.validFrom ? ' · ' + f.validFrom.slice(0,10) : '') + '</div>' +
    '<a href="' + gmaps + '" target="_blank" rel="noopener" style="font-size:12.5px;">Otvori u Google Maps ↗</a>' +
    '<details style="margin-top:6px;"><summary style="cursor:pointer;font-size:12px;color:#6B6B6B;">Svi podaci</summary>' +
    '<div style="font-family:var(--font-mono);font-size:11.5px;margin-top:4px;color:#444;">' + tagoviHtml + '</div></details>' +
    '</div>';
}

function trenutnoVidljive(){
  const q = document.getElementById('q').value.toLowerCase().trim();
  return FEATURES.filter(f => {
    if (selectedZup.has(f.zupanija)) return false;
    if (selectedBuilding.size > 0 && !selectedBuilding.has(tag(f,'building') || '(bez oznake)')) return false;
    if (selectedLevels.size > 0 && !selectedLevels.has(tag(f,'building:levels') || '(nepoznato)')) return false;
    if (q){
      const hay = [tag(f,'addr:street'), tag(f,'addr:housenumber'), tag(f,'addr:city'), f.zupanija, tag(f,'building')].filter(Boolean).join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

function render(){
  cluster.clearLayers();
  const vidljive = trenutnoVidljive();
  vidljive.forEach(f => {
    let layer;
    if (f.obris && f.obris.length >= 3){
      const latlngs = f.obris.map(p => [p[1], p[0]]);
      layer = L.polygon(latlngs, { color: '#B6650C', weight: 1.5, fillColor: '#E8871E', fillOpacity: 0.7 });
    } else {
      layer = L.circleMarker([f.lat, f.lon], { radius: 5, color: '#B6650C', weight: 1, fillColor: '#E8871E', fillOpacity: 0.85 });
    }
    layer.bindPopup(opis(f));
    cluster.addLayer(layer);
  });
  document.getElementById('stats').innerHTML = '<b>' + vidljive.length.toLocaleString('hr-HR') + '</b> prikazanih zgrada';
}

function buildZupList(){
  const counts = {};
  ZUPANIJE.features.forEach(f => counts[f.properties.naziv] = 0);
  FEATURES.forEach(f => { if (f.zupanija) counts[f.zupanija] = (counts[f.zupanija]||0)+1; });
  const sorted = Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  const wrap = document.getElementById('zupList');
  wrap.innerHTML = '';
  sorted.forEach(([naziv, c]) => {
    const row = document.createElement('div');
    row.className = 'zup-row';
    row.innerHTML = '<input type="checkbox" checked><span>' + naziv + '</span><span class="cnt">' + c + '</span>';
    row.querySelector('input').addEventListener('change', (e) => {
      if (e.target.checked) selectedZup.delete(naziv); else selectedZup.add(naziv);
      render();
      if (dguEnabled) ucitajDguZaVidljive();
    });
    wrap.appendChild(row);
  });
}

function buildFacetList(containerId, key, fallback, selectedSet){
  const counts = {};
  FEATURES.forEach(f => {
    const v = tag(f, key) || fallback;
    counts[v] = (counts[v]||0) + 1;
  });
  let entries = Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  if (key === 'building:levels') entries = entries.sort((a,b) => (parseInt(a[0])||99) - (parseInt(b[0])||99));
  entries = entries.slice(0, 10);
  const wrap = document.getElementById(containerId);
  wrap.innerHTML = '';
  entries.forEach(([val, c]) => {
    const row = document.createElement('div');
    row.className = 'facet-row';
    row.innerHTML = '<input type="checkbox"><span>' + val + '</span><span class="cnt">' + c + '</span>';
    row.querySelector('input').addEventListener('change', (e) => {
      if (e.target.checked) selectedSet.add(val); else selectedSet.delete(val);
      render();
    });
    wrap.appendChild(row);
  });
}

document.getElementById('q').addEventListener('input', render);
document.getElementById('rangeLabel').textContent = FEATURES.length.toLocaleString('hr-HR') + ' zgrada u odabranom razdoblju';
buildZupList();
buildFacetList('buildingList', 'building', '(bez oznake)', selectedBuilding);
buildFacetList('levelsList', 'building:levels', '(nepoznato)', selectedLevels);
render();
<\/script>
</body></html>`;
}

function formatDatum(iso){
  if (!iso) return '–';
  const d = new Date(iso);
  if (isNaN(d)) return '–';
  return d.toLocaleDateString('hr-HR', { day: '2-digit', month: '2-digit', year: 'numeric' });
}

init().catch(err => {
  console.error(err);
  $('#updatedTag').innerHTML = '<span class="updated-dot" style="background:#C0392B;"></span> Greška pri učitavanju podataka';
});
</script>
